<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>PARI Core Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-hover: #1b2438;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.4);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --badge-bg: rgba(0, 0, 0, 0.75);
      --badge-border: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1f293d;
      margin-bottom: 28px;
    }
    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .logo span { color: var(--accent); }
    .nav-tabs {
      display: flex;
      gap: 10px;
      background: #121826;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid #1f293d;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .search-bar {
      flex: 1;
      max-width: 320px;
    }
    .search-bar input {
      width: 100%;
      background: #121826;
      border: 1px solid #243048;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    .search-bar input:focus { border-color: var(--accent); }
    
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #1c2538;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      position: relative;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.6);
      border-color: #2e3d5c;
    }
    .poster-box {
      width: 100%;
      height: 310px;
      background: #161f33;
      position: relative;
      overflow: hidden;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-badges {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }
    .badge {
      background: var(--badge-bg);
      backdrop-filter: blur(6px);
      border: 1px solid var(--badge-border);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-4k { border-color: #f59e0b; color: #fbbf24; }
    .badge-hdr { border-color: #38bdf8; color: #38bdf8; }
    .badge-atmos { border-color: #a855f7; color: #c084fc; }
    .badge-multi { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .btn-play-card {
      width: 100%;
      padding: 9px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-play-card:hover { background: #b90710; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #121826;
      width: 100%;
      max-width: 650px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #23304a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #172033;
      border-bottom: 1px solid #23304a;
    }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .modal-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .source-item {
      background: #182236;
      border: 1px solid #25334e;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .source-item:hover {
      border-color: var(--accent);
    }
    .source-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .source-name {
      font-size: 13px;
      color: #e2e8f0;
      word-break: break-all;
      font-family: monospace;
    }
    .source-actions {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      border: none;
    }
    .btn-stream { background: var(--accent); color: #fff; }
    .btn-vlc { background: #f97316; color: #fff; }
    .btn-dl { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-action:hover { opacity: 0.9; }

    /* Video Player Modal */
    #videoPlayerModal .modal-content {
      max-width: 900px;
    }
    .video-box {
      width: 100%;
      height: 480px;
      background: #000;
    }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <header>
    <div class="logo">PARI <span>STREAM</span></div>
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('c01', event)">Movies</button>
      <button class="tab-btn" onclick="switchTab('c02', event)">Series</button>
      <button class="tab-btn" onclick="switchTab('c03', event)">Songs</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
    </div>
  </header>

  <main>
    <div class="media-grid" id="mediaGrid"></div>
  </main>

  <div class="modal" id="sourceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="sourceTitle">Select Version</h3>
        <button class="close-btn" onclick="closeModal('sourceModal')">✕</button>
      </div>
      <div class="modal-body" id="sourcesList"></div>
    </div>
  </div>

  <div class="modal" id="videoPlayerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="playerTitle">Playback</h3>
        <button class="close-btn" onclick="closeVideoPlayer()">✕</button>
      </div>
      <div class="video-box" id="videoContainer"></div>
    </div>
  </div>

  <script>
    const ADMIN_KEY = "moinu_secret_2026";
    let currentCatalog = [];
    let groupedCatalog = [];
    let currentTab = "c01";

    const sources = {
      c01: "./chunks/data_c01.json",
      c02: "./chunks/data_c02.json",
      c03: "./chunks/data_c03.json"
    };

    async function loadCatalog(type) {
      currentTab = type;
      try {
        const res = await fetch(sources[type]);
        const data = await res.json();
        
        groupedCatalog = groupDuplicates(data);
        renderCards(groupedCatalog);
      } catch (err) {
        console.error("Failed loading catalog:", err);
        document.getElementById("mediaGrid").innerHTML = "<p style='color:#ef4444; padding:20px;'>Data chunk not found in ./chunks/</p>";
      }
    }

    function groupDuplicates(items) {
      const map = new Map();
      items.forEach(item => {
        const key = item.tmdb_id ? `tmdb_${item.tmdb_id}` : `${(item.title || item.name).toLowerCase()}_${item.year || ''}_${item.season || ''}_${item.episode || ''}`;
        
        if (!map.has(key)) {
          map.set(key, {
            ...item,
            variants: [item]
          });
        } else {
          map.get(key).variants.push(item);
        }
      });
      return Array.from(map.values());
    }

    function renderCards(list) {
      const grid = document.getElementById("mediaGrid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.innerHTML = "<p style='color:var(--text-dim); padding:20px;'>No data found.</p>";
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        
        const title = item.title || item.display_name || item.name;
        const year = item.year || (item.season ? `S${item.season} E${item.episode}` : "");
        const poster = item.poster || "https://via.placeholder.com/300x450/161f33/ffffff?text=No+Poster";

        let badgesHtml = "";
        const specs = item.specs || {};
        
        if (item.variants.length > 1) {
          badgesHtml += `<span class="badge badge-multi">${item.variants.length} VERSIONS</span>`;
        }

        if (specs.resolution && (specs.resolution.includes("4K") || specs.resolution.includes("2160p"))) {
          badgesHtml += `<span class="badge badge-4k">4K UHD</span>`;
        } else if (specs.resolution && specs.resolution.includes("1080p")) {
          badgesHtml += `<span class="badge">1080p</span>`;
        }

        if (specs.audio && (specs.audio.includes("Atmos") || specs.audio.includes("Dolby"))) {
          badgesHtml += `<span class="badge badge-atmos">${specs.audio}</span>`;
        }

        card.innerHTML = `
          <div class="poster-box">
            <img src="${poster}" loading="lazy" alt="${title}">
            <div class="card-badges">${badgesHtml}</div>
          </div>
          <div class="card-content">
            <div class="title" title="${title}">${title}</div>
            <div class="meta">
              <span>${year}</span>
              <span>${specs.source || "WEB-DL"}</span>
            </div>
            <button class="btn-play-card" onclick='openSourceSelector(${index})'>▶ Play / Sources (${item.variants.length})</button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openSourceSelector(index) {
      const item = groupedCatalog[index];
      const title = item.title || item.display_name || item.name;
      document.getElementById("sourceTitle").innerText = `${title} - Select Version`;

      const listContainer = document.getElementById("sourcesList");
      listContainer.innerHTML = "";

      item.variants.forEach((v, vIdx) => {
        const specs = v.specs || {};
        const res = specs.resolution || "1080p";
        const src = specs.source || "WEB-DL";
        const aud = specs.audio || "Dolby Audio";
        const ch = specs.channels || "5.1";
        const streamUrl = `https://gdrive-stream.moinudeentv.workers.dev/?id=${v.id}&key=${ADMIN_KEY}`;
        const vlcIntent = `vlc://${streamUrl}`;

        const row = document.createElement("div");
        row.className = "source-item";
        row.innerHTML = `
          <div class="source-info">
            <strong>Version #${vIdx + 1}: ${res} • ${src} • ${aud} (${ch})</strong>
          </div>
          <div class="source-name">${v.name}</div>
          <div class="source-actions">
            <button class="btn-action btn-stream" onclick='startDirectPlay("${title.replace(/'/g, "\\'")}", "${streamUrl}")'>▶ Play in Browser</button>
            <a class="btn-action btn-vlc" href="${vlcIntent}">📡 Open in VLC</a>
            <a class="btn-action btn-dl" href="${streamUrl}" download target="_blank">⬇ Save</a>
          </div>
        `;
        listContainer.appendChild(row);
      });

      document.getElementById("sourceModal").style.display = "flex";
    }

    function startDirectPlay(title, url) {
      closeModal("sourceModal");
      const playerModal = document.getElementById("videoPlayerModal");
      document.getElementById("playerTitle").innerText = title;
      document.getElementById("videoContainer").innerHTML = `
        <video controls autoplay width="100%" height="100%">
          <source src="${url}" type="video/mp4">
          <source src="${url}" type="video/webm">
          Your browser does not support playing this MKV directly. Use 'Open in VLC' or download it.
        </video>
      `;
      playerModal.style.display = "flex";
    }

    function closeVideoPlayer() {
      document.getElementById("videoContainer").innerHTML = "";
      closeModal("videoPlayerModal");
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function switchTab(tab, event) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById("searchInput").value = "";
      loadCatalog(tab);
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = groupedCatalog.filter(item => {
        const title = (item.title || item.display_name || item.name).toLowerCase();
        return title.includes(query);
      });
      renderCards(filtered);
    }

    loadCatalog("c01");
  </script>
</body>
</html>
