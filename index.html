<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-black tracking-wider text-red-600">MOINU<span class="text-white">FLIX</span></h1>
      </div>
      <div class="flex-1 max-w-md">
        <input type="text" id="search" placeholder="Search movies, years..." class="w-full bg-slate-900 border border-slate-700/60 rounded-full px-5 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-red-500 transition-all">
      </div>
      <span id="total-count" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-full font-medium hidden sm:inline-block">Loading...</span>
    </div>
  </header>

  <!-- Movie Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8">
    <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
  </main>

  <script>
    const TMDB_API_KEY = "8414459f230d744b7d383fb4f3014aef"; // Free TMDb key
    let allMovies = [];
    const grid = document.getElementById('movie-grid');
    const search = document.getElementById('search');
    const count = document.getElementById('total-count');

    // Clean title for better TMDb search
    function cleanTitle(rawTitle) {
      return rawTitle
        .replace(/\.[a-zA-Z0-9]+$/, '')
        .replace(/\./g, ' ')
        .replace(/\((SK\d+|Reloaded|[0-9]+)\)/gi, '')
        .replace(/trailer/gi, '')
        .replace(/[_\-]/g, ' ')
        .trim();
    }

    async function fetchMetadata(cleanName) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(cleanName)}`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const item = data.results[0];
          return {
            poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null,
            backdrop: item.backdrop_path ? `https://image.tmdb.org/t/p/w780${item.backdrop_path}` : null,
            rating: item.vote_average ? item.vote_average.toFixed(1) : null,
            year: item.release_date ? item.release_date.split('-')[0] : ''
          };
        }
      } catch (err) {}
      return { poster: null, backdrop: null, rating: null, year: '' };
    }

    async function render(list) {
      grid.innerHTML = '';
      count.innerText = `${list.length} Movies`;

      for (const m of list) {
        const queryTitle = cleanTitle(m.title);
        
        const card = document.createElement('div');
        card.className = "group relative bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-slate-600 transition-all duration-300 shadow-xl flex flex-col justify-between";

        // Placeholder UI while loading image
        card.innerHTML = `
          <div class="relative aspect-[2/3] bg-slate-800 overflow-hidden">
            <div class="poster-img w-full h-full flex items-center justify-center text-slate-600">
              <i class="fa-solid fa-film text-3xl animate-pulse"></i>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80 group-hover:opacity-95 transition-opacity"></div>
            <div class="meta-tag absolute top-2 right-2 flex gap-1"></div>
            <div class="absolute bottom-3 left-3 right-3">
              <h3 class="font-bold text-sm text-white line-clamp-2 leading-tight">${m.title}</h3>
              <p class="release-year text-[11px] text-slate-400 mt-0.5 font-medium"></p>
            </div>
          </div>
          <div class="p-3 bg-slate-900">
            <a href="${m.url}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-semibold py-2 px-3 rounded-xl text-xs transition-all shadow-md">
              <i class="fa-solid fa-play text-[10px]"></i> Play Stream
            </a>
          </div>
        `;
        grid.appendChild(card);

        // Fetch artwork in background
        fetchMetadata(queryTitle).then(meta => {
          const imgContainer = card.querySelector('.poster-img');
          const metaTag = card.querySelector('.meta-tag');
          const yearTag = card.querySelector('.release-year');

          if (meta.poster) {
            imgContainer.innerHTML = `<img src="${meta.poster}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">`;
          }
          if (meta.rating && meta.rating > 0) {
            metaTag.innerHTML = `<span class="bg-black/70 backdrop-blur-sm text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-yellow-400/30 flex items-center gap-1"><i class="fa-solid fa-star text-[9px]"></i> ${meta.rating}</span>`;
          }
          if (meta.year) {
            yearTag.innerText = meta.year;
          }
        });
      }
    }

    fetch('movies.json')
      .then(res => res.json())
      .then(data => {
        allMovies = data;
        render(allMovies);
      })
      .catch(() => {
        grid.innerHTML = '<p class="text-red-500 col-span-full text-center">Failed to load movies.json</p>';
      });

    search.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMovies.filter(m => m.title.toLowerCase().includes(term));
      render(filtered);
    });
  </script>
</body>
</html>
