<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-6xl mx-auto">
    <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
      <h1 class="text-3xl font-black tracking-tight text-red-500">MOINU<span class="text-white">FLIX</span></h1>
      <span id="total-count" class="text-sm bg-slate-800 px-3 py-1 rounded-full text-slate-400">Loading...</span>
    </header>

    <div class="mb-6">
      <input type="text" id="search" placeholder="Search movies..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-red-500 transition-colors">
    </div>

    <div id="movie-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </div>

  <script>
    let allMovies = [];
    const grid = document.getElementById('movie-grid');
    const search = document.getElementById('search');
    const count = document.getElementById('total-count');

    function render(list) {
      grid.innerHTML = '';
      list.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800/80 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition-all shadow-lg";
        card.innerHTML = `
          <h3 class="font-bold text-base mb-3 leading-snug text-slate-100 line-clamp-2">${m.title}</h3>
          <a href="${m.url}" target="_blank" class="w-full text-center bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-3 rounded-lg text-sm transition-colors block">
            Play Stream
          </a>
        `;
        grid.appendChild(card);
      });
      count.innerText = `${list.length} Movies`;
    }

    fetch('movies.json')
      .then(res => res.json())
      .then(data => {
        allMovies = data;
        render(allMovies);
      })
      .catch(err => {
        grid.innerHTML = '<p class="text-red-500">Failed to load movies.</p>';
      });

    search.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMovies.filter(m => m.title.toLowerCase().includes(term));
      render(filtered);
    });
  </script>
</body>
</html>
