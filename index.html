<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen">

  <header class="sticky top-0 z-50 bg-[#0b0f19]/95 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-red-600">MOINU<span class="text-white">FLIX</span></h1>
      <div class="flex-1 max-w-md">
        <input type="text" id="search" placeholder="Search movies..." class="w-full bg-slate-900 border border-slate-700/70 rounded-full px-5 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-red-500">
      </div>
      <span id="total-count" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-full font-medium">Loading...</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8">
    <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
  </main>

  <script>
    const TMDB_API_KEY = "8414459f230d744b7d383fb4f3014aef";
    let allMovies = [];
    const grid = document.getElementById('movie-grid');
    const search = document.getElementById('search');
    const count = document.getElementById('total-count');

    function parseMovieTitle(raw) {
      let title = raw.replace(/\.[a-zA-Z0-9]+$/, '').replace(/\./g, ' ');
      const yearMatch = title.match(/\b(19\d\d|20\d\d)\b/);
      const year = yearMatch ? yearMatch[0] : '';
      title = title.replace(/\(?(19\d\d|20\d\d)\)?/g, '')
                   .replace(/\(SK\d+\)/gi, '')
                   .replace(/trailer/gi, '')
                   .replace(/Reloaded/gi, '')
                   .replace(/[-_()]/g, ' ')
                   .replace(/\s+/g, ' ')
                   .trim();
      return { title, year };
    }

    async function getPoster(name, year) {
      try {
        let url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(name)}`;
        if (year) url += `&year=${year}`;
        let res = await fetch(url);
        let data = await res.json();
        
        if (!data.results || data.results.length === 0) {
          res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(name)}`);
          data = await res.json();
        }

        if (data.results && data.results.length > 0) {
          const item = data.results[0];
          return {
            poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null,
            rating: item.vote_average ? item.vote_average.toFixed(1) : null,
            year: item.release_date ? item.release_date.split('-')[0] : year
          };
        }
      } catch (e) {}
      return { poster: null, rating: null, year: year };
    }

    function render(list) {
      grid.innerHTML = '';
      count.innerText = `${list.length} Movies`;

      list.forEach((m, idx) => {
        const { title: cleanName, year: cleanYear } = parseMovieTitle(m.title);
        const cardId = `movie-card-${idx}`;

        const card = document.createElement('div');
        card.className = "group relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-600 transition-all duration-300 shadow-xl flex flex-col justify-between";
        card.innerHTML = `
          <div class="relative aspect-[2/3] bg-slate-800 overflow-hidden flex items-center justify-center">
            <div id="${cardId}-img" class="w-full h-full flex items-center justify-center text-slate-600">
              <i class="fa-solid fa-film text-3xl animate-pulse"></i>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-85 pointer-events-none"></div>
            <div id="${cardId}-rating" class="absolute top-2 right-2"></div>
            <div class="absolute bottom-3 left-3 right-3 pointer-events-none">
              <h3 class="font-bold text-sm text-white line-clamp-2 leading-tight">${m.title}</h3>
              <p id="${cardId}-year" class="text-[11px] text-slate-400 mt-1 font-medium">${cleanYear}</p>
            </div>
          </div>
          <div class="p-3 bg-slate-900">
            <a href="${m.url}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-semibold py-2 px-3 rounded-xl text-xs transition-all shadow-md">
              <i class="fa-solid fa-play text-[10px]"></i> Play Stream
            </a>
          </div>
        `;
        grid.appendChild(card);

        getPoster(cleanName, cleanYear).then(data => {
          const imgElem = document.getElementById(`${cardId}-img`);
          const ratingElem = document.getElementById(`${cardId}-rating`);
          const yearElem = document.getElementById(`${cardId}-year`);

          if (data.poster) {
            imgElem.innerHTML = `<img src="${data.poster}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">`;
          } else {
            imgElem.innerHTML = `<div class="p-4 text-center text-xs text-slate-500 font-medium">${m.title}</div>`;
          }

          if (data.rating && data.rating > 0) {
            ratingElem.innerHTML = `<span class="bg-black/70 backdrop-blur-sm text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-yellow-400/30 flex items-center gap-1"><i class="fa-solid fa-star text-[9px]"></i> ${data.rating}</span>`;
          }

          if (data.year) {
            yearElem.innerText = data.year;
          }
        });
      });
    }

    fetch('movies.json')
      .then(res => res.json())
      .then(data => {
        allMovies = data;
        render(allMovies);
      })
      .catch(() => {
        grid.innerHTML = '<p class="text-red-500 col-span-full text-center">Failed to load movies.json</p>';
      });

    search.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMovies.filter(m => m.title.toLowerCase().includes(term));
      render(filtered);
    });
  </script>
</body>
</html>
