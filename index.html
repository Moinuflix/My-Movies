<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#0b0f19]/95 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <h1 class="text-2xl sm:text-3xl font-black tracking-wider text-red-600">MOINU<span class="text-white">FLIX</span></h1>
      <div class="flex-1 max-w-md">
        <input type="text" id="search" placeholder="Search movies, genres..." class="w-full bg-slate-900 border border-slate-700/70 rounded-full px-5 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-red-500 transition-all">
      </div>
      <span id="total-count" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-full font-medium">Loading...</span>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8">
    <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
  </main>

  <script>
    let allMovies = [];
    const grid = document.getElementById('movie-grid');
    const search = document.getElementById('search');
    const count = document.getElementById('total-count');

    function render(list) {
      grid.innerHTML = '';
      count.innerText = `${list.length} Movies`;

      list.forEach(m => {
        // Poster check
        const posterImg = m.poster 
          ? `<img src="${m.poster}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">`
          : `<div class="w-full h-full flex flex-col items-center justify-center p-3 text-center bg-slate-800 text-slate-500"><i class="fa-solid fa-film text-3xl mb-2"></i><span class="text-xs font-semibold">${m.title}</span></div>`;

        // Clearlogo or Title text
        const logoDisplay = m.clearlogo
          ? `<img src="${m.clearlogo}" alt="${m.title}" class="max-h-10 max-w-[80%] object-contain drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] mb-1">`
          : `<h3 class="font-bold text-sm text-white line-clamp-2 leading-tight drop-shadow">${m.title}</h3>`;

        // Rating Badge
        const ratingBadge = (m.rating && m.rating !== "0.0" && m.rating !== "N/A")
          ? `<div class="absolute top-2 right-2 bg-black/75 backdrop-blur-md text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-yellow-400/30 flex items-center gap-1 shadow"><i class="fa-solid fa-star text-[9px]"></i> ${m.rating}</div>`
          : '';

        // Trailer Link (Handles both m.trailer_url and m.trailer)
        const trailerTarget = m.trailer_url || m.trailer || '';
        const trailerBtn = trailerTarget
          ? `<a href="${trailerTarget}" target="_blank" class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-red-600/30 text-red-500 rounded-lg transition-all border border-slate-700" title="Watch Trailer"><i class="fa-brands fa-youtube text-sm"></i></a>`
          : '';

        // Songs Jukebox Link (Handles both songs_list and single songs string)
        let songsTarget = '';
        if (Array.isArray(m.songs_list) && m.songs_list.length > 0) {
          songsTarget = m.songs_list[0].url;
        } else if (typeof m.songs === 'string') {
          songsTarget = m.songs;
        }

        const songsBtn = songsTarget
          ? `<a href="${songsTarget}" target="_blank" class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-emerald-600/30 text-emerald-400 rounded-lg transition-all border border-slate-700" title="Play Songs"><i class="fa-solid fa-music text-xs"></i></a>`
          : '';

        const card = document.createElement('div');
        card.className = "group relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-600 transition-all duration-300 shadow-xl flex flex-col justify-between";
        card.innerHTML = `
          <div class="relative aspect-[2/3] bg-slate-800 overflow-hidden">
            ${posterImg}
            <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent opacity-90 pointer-events-none"></div>
            ${ratingBadge}
            <div class="absolute bottom-3 left-3 right-3 pointer-events-none">
              ${logoDisplay}
              <p class="text-[11px] text-slate-400 mt-1 font-medium">${m.year || ''}</p>
            </div>
          </div>
          <div class="p-3 bg-slate-900 flex items-center gap-1.5">
            <a href="${m.url}" target="_blank" class="flex-1 flex items-center justify-center gap-1.5 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-semibold py-2 px-2 rounded-lg text-xs transition-all shadow-md">
              <i class="fa-solid fa-play text-[10px]"></i> Play
            </a>
            ${trailerBtn}
            ${songsBtn}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    fetch('movies.json')
      .then(res => res.json())
      .then(data => {
        allMovies = data;
        render(allMovies);
      })
      .catch(() => {
        grid.innerHTML = '<p class="text-red-500 col-span-full text-center">Failed to load movies.json</p>';
      });

    search.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allMovies.filter(m => 
        (m.title && m.title.toLowerCase().includes(term)) || 
        (m.year && m.year.toString().includes(term)) ||
        (m.genre && Array.isArray(m.genre) && m.genre.some(g => g.toLowerCase().includes(term)))
      );
      render(filtered);
    });
  </script>
</body>
</html>
