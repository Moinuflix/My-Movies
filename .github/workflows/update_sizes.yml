name: Auto Calculate & Update Movie Sizes

on:
  workflow_dispatch: # Is se GitHub par "Run workflow" ka manual button aa jata hai

jobs:
  update-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Calculate and Fill Missing Sizes
        run: |
          python - << 'EOF'
          import json
          import os

          c01_path = 'chunks/data_c01.json'
          inbox_path = 'inbox_arrivals.json'

          if not os.path.exists(c01_path):
              print("data_c01.json not found!")
              exit(0)

          with open(c01_path, 'r', encoding='utf-8') as f:
              movies = json.load(f)

          # Inbox se real sizes map karna
          size_map = {}
          if os.path.exists(inbox_path):
              with open(inbox_path, 'r', encoding='utf-8') as f:
                  try:
                      inbox = json.load(f)
                      for item in inbox:
                          gid = item.get("gdrive_id") or item.get("id")
                          sz = item.get("size")
                          if gid and sz:
                              size_map[str(gid).strip()] = sz
                  except Exception as e:
                      print(f"Error reading inbox: {e}")

          updated_count = 0
          for m in movies:
              gid = str(m.get("id") or m.get("gdrive_id") or "").strip()
              
              current_size = m.get("specs", {}).get("size") or (m.get("versions", [{}])[0].get("size") if m.get("versions") else "")
              
              if not current_size or current_size == "":
                  # 1. Real size from inbox if matched
                  if gid in size_map:
                      new_size = size_map[gid]
                  else:
                      # 2. Smart auto-estimate based on 4K / 1080p tag
                      name_str = str(m.get("name", "")).lower()
                      is_4k = "2160p" in name_str or "4k" in name_str or "uhd" in name_str
                      new_size = "14.5 GB" if is_4k else "2.8 GB"
                  
                  if "specs" not in m or not isinstance(m["specs"], dict):
                      m["specs"] = {}
                  m["specs"]["size"] = new_size
                  
                  if m.get("versions") and len(m["versions"]) > 0:
                      m["versions"][0]["size"] = new_size
                      if "specs" not in m["versions"][0] or not isinstance(m["versions"][0]["specs"], dict):
                          m["versions"][0]["specs"] = {}
                      m["versions"][0]["specs"]["size"] = new_size
                      
                  updated_count += 1

          print(f"Total {updated_count} movies updated with file sizes!")

          with open(c01_path, 'w', encoding='utf-8') as f:
              json.dump(movies, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit & Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chunks/data_c01.json
          git commit -m "Auto-Update missing GB sizes across movie chunks" || echo "No changes to commit"
          git push
