name: Auto Calculate & Update Movie Sizes

on:
  workflow_dispatch:

jobs:
  update-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Exact Real Sizes via Cloudflare Worker
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import requests
          import time

          c01_path = 'chunks/data_c01.json'
          if not os.path.exists(c01_path):
              print("data_c01.json not found!")
              exit(0)

          with open(c01_path, 'r', encoding='utf-8') as f:
              movies = json.load(f)

          headers = {
              'User-Agent': 'Kodi-MoinuTV-PrivatePlayer/1.0'
          }

          def get_accurate_size(stream_url, gdrive_id):
              url = stream_url.split('|')[0] if stream_url else ""
              if not url and gdrive_id:
                  url = f"https://gdrive-stream.moinudeentv.workers.dev/?id={gdrive_id}"
              
              if not url:
                  return None

              try:
                  # HEAD request gives exact file byte size instantly without downloading
                  r = requests.head(url, headers=headers, allow_redirects=True, timeout=12)
                  cl = r.headers.get('Content-Length')
                  if cl and int(cl) > 1024 * 1024:
                      bytes_val = int(cl)
                      gb_val = bytes_val / (1024 * 1024 * 1024)
                      if gb_val >= 1.0:
                          return f"{round(gb_val, 1)} GB"
                      else:
                          mb_val = bytes_val / (1024 * 1024)
                          return f"{round(mb_val, 0)} MB"
              except Exception as e:
                  pass
              return None

          updated_count = 0
          for m in movies:
              gid = str(m.get("id") or m.get("gdrive_id") or "").strip()
              surl = m.get("stream_url", "")
              
              if not gid:
                  match = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', surl)
                  if match:
                      gid = match.group(1)

              real_sz = get_accurate_size(surl, gid)

              if real_sz:
                  if "specs" not in m or not isinstance(m["specs"], dict):
                      m["specs"] = {}
                  m["specs"]["size"] = real_sz

                  if m.get("versions") and len(m["versions"]) > 0:
                      for v in m["versions"]:
                          v["size"] = real_sz
                          if "specs" not in v or not isinstance(v["specs"], dict):
                              v["specs"] = {}
                          v["specs"]["size"] = real_sz

                  print(f"✔ {m.get('title')}: {real_sz}")
                  updated_count += 1
                  time.sleep(0.05) # Polite delay
              else:
                  print(f"⚠ Could not resolve size for: {m.get('title')}")

          print(f"\nFinal: Updated {updated_count} movies with real file sizes!")

          with open(c01_path, 'w', encoding='utf-8') as f:
              json.dump(movies, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit & Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add chunks/data_c01.json
          git commit -m "Real size sync: Read exact Content-Length via worker" || echo "No changes"
          git push
