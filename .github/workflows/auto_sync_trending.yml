name: Auto Sync Trending & Metadata

on:
  schedule:
    - cron: '0 18 * * *'
  push:
    paths:
      - 'chunks/data_c01.json'
  workflow_dispatch:

jobs:
  sync-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SIMKL Trending Generator
        run: |
          python generate_simkl_trending.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "MoinuFlix Bot"
          git config --global user.email "bot@moinuflix.local"
          git add chunks/trending.json chunks/watched.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Trending Top 10 via SIMKL [skip ci]" && git push)
