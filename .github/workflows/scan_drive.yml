name: Scan Google Drive Arrivals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rclone & Python
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y python3

      - name: Configure Rclone
        env:
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > make_conf.py
          import os

          token = os.environ.get("GDRIVE_TOKEN", "").strip()
          conf = f"[gdrive]\ntype = drive\nscope = drive\ntoken = {token}\n"

          with open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w", encoding="utf-8") as f:
              f.write(conf)
          EOF
          python3 make_conf.py

      - name: Auto Audit & Generate Inbox
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os

          print("--- STEP 1: SCANNING GOOGLE DRIVE (RECURSIVE) ---")
          cmd = ["rclone", "lsjson", "gdrive:", "-R", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          if res.returncode != 0:
              print(f"Rclone Error: {res.stderr}")
              drive_files = []
          else:
              try:
                  drive_files = json.loads(res.stdout) if res.stdout else []
              except Exception as e:
                  print(f"JSON Parse Error from Rclone: {e}")
                  drive_files = []

          print(f"Total raw files found in Google Drive: {len(drive_files)}")

          def load_json(filepath):
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except Exception as err:
                      print(f"Error loading {filepath}: {err}")
              return []

          master_list = load_json("chunks/data_c01.json")
          tamil_list = load_json("chunks/data_c01_tamil.json")
          telugu_list = load_json("chunks/data_c01_telugu.json")
          hindi_list = load_json("chunks/data_c01_hindi.json")
          english_list = load_json("chunks/data_c01_english.json")

          def extract_ids(data_list):
              s = set()
              for x in data_list:
                  if isinstance(x, dict):
                      if x.get("id"): s.add(x.get("id"))
                      if x.get("gdrive_id"): s.add(x.get("gdrive_id"))
              return s

          master_ids = extract_ids(master_list)
          category_ids = extract_ids(tamil_list) | extract_ids(telugu_list) | extract_ids(hindi_list) | extract_ids(english_list)

          print(f"Indexed in Master: {len(master_ids)} files")
          print(f"Indexed in 4 Categories: {len(category_ids)} files")

          inbox = []

          for file in drive_files:
              fname = file.get("Path", "")
              fid = file.get("ID", "")
              fbytes = file.get("Size", 0)

              if not fname.lower().endswith(('.mkv', '.mp4', '.avi', '.ts')):
                  continue

              gb_val = round(fbytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              in_master = fid in master_ids
              in_category = fid in category_ids

              if in_master and in_category:
                  continue

              status = "completely_missing"
              if in_master and not in_category:
                  status = "missing_in_category"

              lower = fname.lower()
              target_cat = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target_cat = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target_cat = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target_cat = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              display_title = os.path.basename(fname).rsplit(".", 1)[0].replace(".", " ")

              inbox.append({
                  "title": display_title,
                  "gdrive_id": fid,
                  "size": clean_size,
                  "status": status,
                  "target_category": target_cat,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={fid}|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0"
              })

          print(f"--- STEP 2: SUMMARY ---")
          print(f"Missing / Pending Movies for Inbox: {len(inbox)}")

          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(inbox, f, indent=2, ensure_ascii=False)

          print("Successfully written to inbox_arrivals.json")
          EOF

          python3 scan_arrivals.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox_arrivals.json
          git diff --staged --quiet || (git commit -m "Auto-Audit: Updated Inbox Arrivals" && git push origin main)
