name: Scan Google Drive Arrivals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rclone & Python
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y python3

      - name: Configure Rclone
        env:
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > make_conf.py
          import os

          token = os.environ.get("GDRIVE_TOKEN", "").strip()
          conf = f"[gdrive]\ntype = drive\nscope = drive\ntoken = {token}\n"

          with open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w", encoding="utf-8") as f:
              f.write(conf)
          EOF
          python3 make_conf.py

      - name: Auto Audit & Generate Inbox
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os
          import re

          print("--- STEP 1: SCANNING GOOGLE DRIVE ---")
          cmd = ["rclone", "lsjson", "gdrive:", "-R", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          if res.returncode != 0:
              print(f"Rclone Error: {res.stderr}")
              drive_files = []
          else:
              try:
                  drive_files = json.loads(res.stdout) if res.stdout else []
              except Exception as e:
                  print(f"JSON Parse Error: {e}")
                  drive_files = []

          print(f"Total raw files found in Google Drive: {len(drive_files)}")

          def load_json(filepath):
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except:
                      pass
              return []

          master_list = load_json("chunks/data_c01.json")
          tamil_list = load_json("chunks/data_c01_tamil.json")
          telugu_list = load_json("chunks/data_c01_telugu.json")
          hindi_list = load_json("chunks/data_c01_hindi.json")
          english_list = load_json("chunks/data_c01_english.json")

          def clean_title_text(text):
              if not text: return ""
              # Brackets aur extra specs remove karein
              t = re.sub(r'\[.*?\]|\(.*?\)|\.mkv|\.mp4', ' ', str(text).lower())
              t = re.sub(r'[\._\-\+]', ' ', t)
              words = [w for w in t.split() if w not in ['1080p', '2160p', '4k', 'hevc', 'x264', 'x265', 'web', 'dl', 'bluray', 'dts', 'atmos', 'ddp5', 'aac']]
              return "".join(words)

          # Extract IDs & Clean Names
          def index_database(data_list):
              id_set = set()
              name_set = set()

              for x in data_list:
                  if not isinstance(x, dict): continue

                  # 1. Main ID
                  if x.get("id"): id_set.add(str(x.get("id")).strip())
                  if x.get("gdrive_id"): id_set.add(str(x.get("gdrive_id")).strip())

                  # 2. Stream URL ID
                  url = x.get("stream_url", "")
                  m = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', url)
                  if m: id_set.add(m.group(1))

                  # 3. Versions IDs
                  for v in x.get("versions", []):
                      if isinstance(v, dict):
                          if v.get("id"): id_set.add(str(v.get("id")).strip())
                          vm = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', v.get("stream_url", ""))
                          if vm: id_set.add(vm.group(1))

                  # 4. Normalized Names
                  for key in ["title", "name", "original_title"]:
                      val = x.get(key)
                      if val:
                          cleaned = clean_title_text(val)
                          if len(cleaned) > 2:
                              name_set.add(cleaned)

              return id_set, name_set

          master_ids, master_names = index_database(master_list)
          cat_ids, cat_names = index_database(tamil_list + telugu_list + hindi_list + english_list)

          print(f"Total Unique IDs in Master: {len(master_ids)}")
          print(f"Total Unique Titles in Master: {len(master_names)}")

          inbox = []

          for file in drive_files:
              fname = file.get("Path", "")
              fid = str(file.get("ID", "")).strip()
              fbytes = file.get("Size", 0)

              if not fname.lower().endswith(('.mkv', '.mp4', '.avi', '.ts')):
                  continue

              # Clean integer rounded GB
              gb_val = round(fbytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              # Matching Check: ID match ya Name match
              clean_drive_name = clean_title_text(os.path.basename(fname))

              in_master = (fid in master_ids) or (clean_drive_name in master_names and len(clean_drive_name) > 3)
              in_category = (fid in cat_ids) or (clean_drive_name in cat_names and len(clean_drive_name) > 3)

              # Agar dono me mojood hai toh skip!
              if in_master and in_category:
                  continue

              status = "completely_missing"
              if in_master and not in_category:
                  status = "missing_in_category"

              lower = fname.lower()
              target_cat = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target_cat = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target_cat = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target_cat = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              display_title = os.path.basename(fname).rsplit(".", 1)[0].replace(".", " ")

              inbox.append({
                  "title": display_title,
                  "gdrive_id": fid,
                  "size": clean_size,
                  "status": status,
                  "target_category": target_cat,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={fid}|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0"
              })

          print(f"Genuine missing movies for inbox: {len(inbox)}")
          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(inbox, f, indent=2, ensure_ascii=False)
          EOF

          python3 scan_arrivals.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox_arrivals.json
          git diff --staged --quiet || (git commit -m "Auto-Audit: Updated Inbox Arrivals" && git push origin main)
