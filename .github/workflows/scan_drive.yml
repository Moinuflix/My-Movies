name: Scan Google Drive Arrivals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# Push permission fix (Exit code 128 solution)
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rclone & Python
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y python3

      - name: Configure Rclone
        env:
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_TOKEN
          EOF

      - name: Run Scan & Clean GB Rounder
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os

          # 1. Google Drive se video files fetch karein
          cmd = ["rclone", "lsjson", "gdrive:", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, text=True)
          drive_files = json.loads(res.stdout) if res.stdout else []

          # 2. Existing JSON chunks se ID check karein taaki duplicate na aaye
          existing_ids = set()
          chunks_dir = "chunks"
          if os.path.exists(chunks_dir):
              for f in os.listdir(chunks_dir):
                  if f.endswith(".json"):
                      try:
                          with open(os.path.join(chunks_dir, f), "r", encoding="utf-8") as jf:
                              data = json.load(jf)
                              for item in data:
                                  if "gdrive_id" in item:
                                      existing_ids.add(item["gdrive_id"])
                      except:
                          pass

          arrivals = []
          for file in drive_files:
              file_id = file.get("ID")
              file_name = file.get("Path")
              file_bytes = file.get("Size", 0)

              if not file_name.lower().endswith(('.mkv', '.mp4', '.avi')):
                  continue

              if file_id in existing_ids:
                  continue

              # Clean GB Rounding: 14.2 GB -> 14 GB, 2.4 GB -> 2 GB
              gb_val = round(file_bytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              # Industry Target detection
              lower = file_name.lower()
              target = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              arrivals.append({
                  "title": file_name.rsplit(".", 1)[0].replace(".", " "),
                  "gdrive_id": file_id,
                  "size": clean_size,
                  "target_category": target,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={file_id}"
              })

          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(arrivals, f, indent=2, ensure_ascii=False)

          print(f"Scan complete: {len(arrivals)} new arrivals ready with clean GB tags.")
          EOF

          python3 scan_arrivals.py

      - name: Commit & Push Inbox
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox_arrivals.json
          git commit -m "Auto-Sync: Updated Drive Arrivals [Clean GB]" || echo "No changes to commit"
          git push origin main
