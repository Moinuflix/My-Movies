- name: Auto Audit & Generate Inbox
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os
          import re

          print("--- STEP 1: SCANNING GOOGLE DRIVE ---")
          cmd = ["rclone", "lsjson", "gdrive:", "-R", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          if res.returncode != 0:
              print(f"Rclone Error: {res.stderr}")
              drive_files = []
          else:
              try:
                  drive_files = json.loads(res.stdout) if res.stdout else []
              except Exception as e:
                  print(f"JSON Parse Error: {e}")
                  drive_files = []

          print(f"Total files in Google Drive: {len(drive_files)}")

          def load_json(filepath):
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except:
                      pass
              return []

          master_list = load_json("chunks/data_c01.json")
          tamil_list = load_json("chunks/data_c01_tamil.json")
          telugu_list = load_json("chunks/data_c01_telugu.json")
          hindi_list = load_json("chunks/data_c01_hindi.json")
          english_list = load_json("chunks/data_c01_english.json")

          # Normalize String for fuzzy title match
          def clean_str(s):
              if not s: return ""
              s = re.sub(r'\[.*?\]|\(.*?\)|\.mkv|\.mp4', ' ', str(s).lower())
              s = re.sub(r'[^a-zA-Z0-9]', '', s)
              return s

          master_ids = set()
          master_titles = set()

          # Sabhi databases ka complete index banayein
          all_existing = master_list + tamil_list + telugu_list + hindi_list + english_list

          for x in all_existing:
              if not isinstance(x, dict): continue

              # 1. Main ID
              if x.get("id"): master_ids.add(str(x.get("id")).strip())
              if x.get("gdrive_id"): master_ids.add(str(x.get("gdrive_id")).strip())

              # 2. Stream URL se ID
              url = x.get("stream_url", "")
              m = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', url)
              if m: master_ids.add(m.group(1))

              # 3. Versions ke andar se ID
              for v in x.get("versions", []):
                  if isinstance(v, dict):
                      if v.get("id"): master_ids.add(str(v.get("id")).strip())
                      vm = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', v.get("stream_url", ""))
                      if vm: master_ids.add(vm.group(1))

              # 4. Clean Titles (e.g. "Kaappaan", "Demonte Colony 2")
              for key in ["title", "original_title", "name"]:
                  if x.get(key):
                      c = clean_str(x.get(key))
                      if len(c) >= 3:
                          master_titles.add(c[:12]) # Core name match

          print(f"Total Known Movie IDs: {len(master_ids)}")
          print(f"Total Known Movie Titles: {len(master_titles)}")

          inbox = []

          for file in drive_files:
              fname = file.get("Path", "")
              fid = str(file.get("ID", "")).strip()
              fbytes = file.get("Size", 0)

              if not fname.lower().endswith(('.mkv', '.mp4', '.avi', '.ts')):
                  continue

              clean_drive_name = clean_str(os.path.basename(fname))

              # RULE: Agar Drive ID pehle se kisi bhi JSON me hai -> SKIP!
              if fid in master_ids:
                  continue

              # RULE: Agar Movie Title pehle se kisi bhi JSON me hai -> SKIP!
              is_title_match = False
              for t in master_titles:
                  if t in clean_drive_name:
                      is_title_match = True
                      break

              if is_title_match:
                  continue

              # Sirf wahi aayega jo waqai NAYA hai
              gb_val = round(fbytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              lower = fname.lower()
              target_cat = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target_cat = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target_cat = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target_cat = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              display_title = os.path.basename(fname).rsplit(".", 1)[0].replace(".", " ")

              inbox.append({
                  "title": display_title,
                  "gdrive_id": fid,
                  "size": clean_size,
                  "status": "completely_missing",
                  "target_category": target_cat,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={fid}|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0"
              })

          print(f"--- FINAL CLEAN RESULT ---")
          print(f"Actually Brand New Missing Movies: {len(inbox)}")

          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(inbox, f, indent=2, ensure_ascii=False)
          EOF

          python3 scan_arrivals.py
