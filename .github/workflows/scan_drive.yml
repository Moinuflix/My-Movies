name: Scan Google Drive Arrivals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rclone & Python
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          sudo apt-get install -y python3

      - name: Configure Rclone
        env:
          GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_TOKEN
          EOF

      - name: Auto Audit & Generate Inbox
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os

          # 1. Drive files fetch
          cmd = ["rclone", "lsjson", "gdrive:", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, text=True)
          drive_files = json.loads(res.stdout) if res.stdout else []

          # Helper to load JSON
          def load_json(filepath):
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except:
                      pass
              return []

          master_list = load_json("chunks/data_c01.json")
          tamil_list = load_json("chunks/data_c01_tamil.json")
          telugu_list = load_json("chunks/data_c01_telugu.json")
          hindi_list = load_json("chunks/data_c01_hindi.json")
          english_list = load_json("chunks/data_c01_english.json")

          master_ids = {x.get("gdrive_id") for x in master_list if x.get("gdrive_id")}
          category_ids = set()
          for lst in [tamil_list, telugu_list, hindi_list, english_list]:
              for x in lst:
                  if x.get("gdrive_id"):
                      category_ids.add(x.get("gdrive_id"))

          inbox = []

          for file in drive_files:
              fname = file.get("Path", "")
              fid = file.get("ID", "")
              fbytes = file.get("Size", 0)

              if not fname.lower().endswith(('.mkv', '.mp4', '.avi')):
                  continue

              # Clean GB Rounding: 14.2 GB -> 14 GB
              gb_val = round(fbytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              in_master = fid in master_ids
              in_category = fid in category_ids

              # Status track karein
              status = "completely_missing"
              if in_master and not in_category:
                  status = "missing_in_category"
              elif in_master and in_category:
                  continue # Already fully synced, skip

              # Language guess
              lower = fname.lower()
              target_cat = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target_cat = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target_cat = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target_cat = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              inbox.append({
                  "title": fname.rsplit(".", 1)[0].replace(".", " "),
                  "gdrive_id": fid,
                  "size": clean_size,
                  "status": status,
                  "target_category": target_cat,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={fid}"
              })

          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(inbox, f, indent=2, ensure_ascii=False)

          print(f"Inbox updated: {len(inbox)} items pending.")
          EOF

          python3 scan_arrivals.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox_arrivals.json
          git commit -m "Auto-Audit: Updated Inbox Arrivals" || echo "No changes"
          git push origin main
