- name: Auto Audit & Generate Inbox
        run: |
          cat << 'EOF' > scan_arrivals.py
          import subprocess
          import json
          import os
          import re

          print("--- STEP 1: SCANNING GOOGLE DRIVE ---")
          cmd = ["rclone", "lsjson", "gdrive:", "-R", "--files-only"]
          res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          if res.returncode != 0:
              print(f"Rclone Error: {res.stderr}")
              drive_files = []
          else:
              try:
                  drive_files = json.loads(res.stdout) if res.stdout else []
              except Exception as e:
                  print(f"JSON Parse Error: {e}")
                  drive_files = []

          print(f"Total raw files in Google Drive: {len(drive_files)}")

          def load_json(filepath):
              if os.path.exists(filepath):
                  try:
                      with open(filepath, "r", encoding="utf-8") as f:
                          return json.load(f)
                  except:
                      pass
              return []

          master_list = load_json("chunks/data_c01.json")
          tamil_list = load_json("chunks/data_c01_tamil.json")
          telugu_list = load_json("chunks/data_c01_telugu.json")
          hindi_list = load_json("chunks/data_c01_hindi.json")
          english_list = load_json("chunks/data_c01_english.json")

          # Ultra-deep ID Extractor (Root + Versions + Stream URLs)
          def extract_all_ids(data_list):
              s = set()
              for x in data_list:
                  if not isinstance(x, dict):
                      continue
                  # 1. Direct ID / gdrive_id
                  if x.get("id"): s.add(str(x.get("id")).strip())
                  if x.get("gdrive_id"): s.add(str(x.get("gdrive_id")).strip())

                  # 2. From Stream URL (?id=xxxx)
                  url = x.get("stream_url", "")
                  m = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', url)
                  if m: s.add(m.group(1))

                  # 3. Inside Versions Array
                  for v in x.get("versions", []):
                      if isinstance(v, dict):
                          if v.get("id"): s.add(str(v.get("id")).strip())
                          v_url = v.get("stream_url", "")
                          vm = re.search(r'[?&]id=([a-zA-Z0-9_-]+)', v_url)
                          if vm: s.add(vm.group(1))
              return s

          master_ids = extract_all_ids(master_list)
          category_ids = extract_all_ids(tamil_list) | extract_all_ids(telugu_list) | extract_all_ids(hindi_list) | extract_all_ids(english_list)

          print(f"Deep Indexed in Master: {len(master_ids)} files")
          print(f"Deep Indexed in Categories: {len(category_ids)} files")

          inbox = []

          for file in drive_files:
              fname = file.get("Path", "")
              fid = str(file.get("ID", "")).strip()
              fbytes = file.get("Size", 0)

              if not fname.lower().endswith(('.mkv', '.mp4', '.avi', '.ts')):
                  continue

              gb_val = round(fbytes / (1024 ** 3))
              clean_size = f"{gb_val} GB"

              in_master = fid in master_ids
              in_category = fid in category_ids

              # Agar Master aur Category dono me ID mil gayi toh skip!
              if in_master and in_category:
                  continue

              status = "completely_missing"
              if in_master and not in_category:
                  status = "missing_in_category"

              lower = fname.lower()
              target_cat = "kollywood"
              target_file = "chunks/data_c01_tamil.json"
              if "telugu" in lower:
                  target_cat = "tollywood"
                  target_file = "chunks/data_c01_telugu.json"
              elif "hindi" in lower:
                  target_cat = "bollywood"
                  target_file = "chunks/data_c01_hindi.json"
              elif any(x in lower for x in ["english", "hollywood", "dual"]):
                  target_cat = "hollywood"
                  target_file = "chunks/data_c01_english.json"

              display_title = os.path.basename(fname).rsplit(".", 1)[0].replace(".", " ")

              inbox.append({
                  "title": display_title,
                  "gdrive_id": fid,
                  "size": clean_size,
                  "status": status,
                  "target_category": target_cat,
                  "target_chunk": target_file,
                  "stream_url": f"https://gdrive-stream.moinudeentv.workers.dev/?id={fid}|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0"
              })

          print(f"Real pending movies for inbox: {len(inbox)}")
          with open("inbox_arrivals.json", "w", encoding="utf-8") as f:
              json.dump(inbox, f, indent=2, ensure_ascii=False)
          EOF

          python3 scan_arrivals.py
