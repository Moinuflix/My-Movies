<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>MoinuFlix — Movies View</title>
  <link rel="stylesheet" href="c_core/ui_style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <aside>
    <div class="brand">
      <div class="brand-logo">M</div>
      <div style="font-size:1.2rem; font-weight:800;">MoinuFlix</div>
    </div>
    <ul class="nav-list">
      <li><a href="m_view.html" class="nav-btn active"><span>📊 Movies View</span></a></li>
      <li><a href="d_sync.html" class="nav-btn "><span>🔔 Drive Sync</span></a></li>
      <li><a href="p_push.html" class="nav-btn "><span>➕ Push Movie</span></a></li>
    </ul>
    <div style="margin-top:auto; padding-top:1rem;">
      <button class="nav-btn" onclick="configureGithubToken()"><span>⚙️ GitHub Token</span></button>
    </div>
  </aside>
  <div id="laser-toast"></div>

  <main>
    <header style="margin-bottom:1.5rem;">
      <h1>Unified Movies Library</h1>
      <p style="color:var(--text-muted);">Real-time Master and Kids chunk visual catalog</p>
    </header>
    <div style="display:flex; gap:8px; margin-bottom:1.5rem; overflow-x:auto;">
      <button class="nav-btn active" style="width:auto; border-radius:20px;" onclick="loadView('chunks/data_c01.json')">🍿 All Movies</button>
      <button class="nav-btn" style="width:auto; border-radius:20px; border-color:var(--laser-green); color:var(--laser-green);" onclick="loadView('chunks/data_c05_kids.json')">🧸 Kids & Cartoon</button>
      <button class="nav-btn" style="width:auto; border-radius:20px;" onclick="loadView('chunks/data_c01_tamil.json')">🌴 Tamil</button>
      <button class="nav-btn" style="width:auto; border-radius:20px;" onclick="loadView('chunks/data_c01_hindi.json')">✨ Hindi</button>
    </div>
    <div id="grid-wrap" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1.5rem;"></div>
  </main>
  <script src="j_core/gh_core.js"></script>
  <script>
    async function loadView(chunk) {
      const gw = document.getElementById("grid-wrap");
      gw.innerHTML = "Loading...";
      const list = await fetchChunk(chunk);
      gw.innerHTML = "";
      list.forEach(m => {
        const c = document.createElement("div");
        c.style.cssText = "background:var(--bg-card); border:1px solid var(--border-color); border-radius:14px; overflow:hidden;";
        c.innerHTML = `
          <div style="height:250px; background:#070d1e;"><img src="${m.poster || ''}" style="width:100%; height:100%; object-fit:cover;"></div>
          <div style="padding:1rem;">
            <div style="font-weight:700; font-size:1rem; margin-bottom:4px;">${m.title} (${m.year || 2024})</div>
            <div style="font-size:0.75rem; color:var(--laser-cyan);">${m.specs?.resolution || '1080p'} • ${m.specs?.size || '3GB'}</div>
          </div>
        `;
        gw.appendChild(c);
      });
    }
    window.onload = () => loadView("chunks/data_c01.json");
  </script>
</body>
</html>
