<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Songs Studio (Connected to GitHub Action) · MoinuFlix</title>
  <style>
    :root {
      --bg: #040711;
      --bg-elevated: #091224;
      --card: rgba(13, 22, 38, 0.85);
      --card-hover: rgba(22, 36, 61, 0.95);
      --border: rgba(56, 189, 248, 0.18);
      --border-strong: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --laser-cyan: #38bdf8;
      --laser-green: #10b981;
      --neon-gold: #f59e0b;
      --error: #ef4444;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
    .site-header { background: rgba(8, 14, 28, 0.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 920px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand-name { font-size: 1.25rem; font-weight: 800; }
    .brand-name span { color: var(--laser-cyan); }
    .page { max-width: 920px; margin: 0 auto; padding: 25px 20px 80px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
    .input, select, textarea { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); color: #fff; border-radius: var(--radius-md); padding: 12px 14px; font-size: 14px; }
    .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--laser-cyan); }
    .search-row { position: relative; display: flex; gap: 10px; }
    .search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); max-height: 320px; overflow-y: auto; z-index: 30; display: none; }
    .search-results.open { display: block; }
    .search-result-item { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .search-result-item:hover { background: var(--card-hover); }
    .search-result-poster { width: 40px; height: 58px; border-radius: 6px; object-fit: cover; }
    .movie-summary { display: none; position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); margin-bottom: 20px; }
    .movie-summary.visible { display: block; }
    .movie-summary-backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.22) blur(1px); }
    .movie-summary-content { position: relative; z-index: 3; display: flex; gap: 18px; padding: 18px; }
    .movie-summary-poster { width: 92px; height: 138px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.15); }
    .meta-chip { font-size: 12px; color: var(--text-secondary); background: rgba(19, 19, 19, 0.85); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; }
    .meta-chip.gold { color: var(--neon-gold); border-color: var(--neon-gold); }
    .btn { border: 1px solid var(--border-strong); background: var(--bg-elevated); color: #fff; border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--card-hover); }
    .btn-cyan { background: var(--laser-cyan); border-color: var(--laser-cyan); color: #000; }
    .btn-cyan:hover { background: #7dd3fc; }
    .btn-block { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; font-weight: 800; }
    .song-list { display: flex; flex-direction: column; gap: 12px; }
    .song-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .song-index { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--laser-cyan); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .song-thumb-preview { width: 80px; height: 45px; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid var(--border); flex-shrink: 0; }
    .song-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .song-title { font-size: 14.5px; font-weight: 700; color: var(--text-primary); }
    .song-artist { font-size: 12px; color: var(--text-secondary); }
    .song-link-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .song-status { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
    .song-status.saved { color: var(--laser-green); font-weight: 700; }
    .hidden { display: none !important; }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--laser-cyan); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #laser-toast { position: fixed; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.98); border: 1px solid var(--laser-cyan); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; display: none; z-index: 500; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-name">Moinu<span>Flix</span> — Songs Studio</div>
    <div style="display:flex; gap:10px;">
      <a href="chunk_01/m_view.html" class="btn">📊 Dashboard</a>
      <button type="button" class="btn" id="tokenConfigBtn">🔑 GitHub Token</button>
    </div>
  </div>
</header>

<main class="page">
  <!-- STEP 1: TMDB SEARCH -->
  <section class="card">
    <h2 style="font-size:14px; font-weight:700; color:var(--laser-cyan); margin-bottom:10px;">Step 1: Search Movie</h2>
    <div class="search-row">
      <input type="text" id="movieSearchInput" class="input" placeholder="Type movie name (e.g. Engeyum Kadhal, Paiyaa)..." autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
  </section>

  <!-- MOVIE SUMMARY & BACKDROP -->
  <div class="movie-summary" id="movieSummary">
    <div class="movie-summary-backdrop" id="movieSummaryBackdrop"></div>
    <div class="movie-summary-content">
      <img class="movie-summary-poster" id="movieSummaryPoster" alt="" />
      <div>
        <h2 id="movieSummaryTitle" style="font-size:22px; font-weight:800;"></h2>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
          <span class="meta-chip" id="movieSummaryYear"></span>
          <span class="meta-chip" id="movieSummaryId"></span>
          <span class="meta-chip" id="movieSummaryLang"></span>
          <span class="meta-chip gold"><span id="movieSummarySongCount">0</span> Verified Tracks</span>
        </div>
      </div>
    </div>
  </div>

  <!-- STEP 2: DIRECT GITHUB ACTION INGEST -->
  <section class="card hidden" id="folderSection">
    <h2 style="font-size:14px; font-weight:700; color:var(--neon-gold); margin-bottom:6px;">Step 2: Sync IDs from GitHub Action Output</h2>
    <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">GitHub Action run hone ke baad seedha button dabayein, saari IDs automatically fetch hokar match ho jayengi:</p>
    
    <div style="display:flex; gap:10px; align-items:center;">
      <button type="button" class="btn btn-cyan" style="padding:12px 20px;" onclick="syncFromGitHubAction()">⚡ Sync from GitHub Action (extracted_tracks.json)</button>
      <span id="syncNotice" style="font-size:12px; color:var(--text-secondary);">Directly connects to repo</span>
    </div>
  </section>

  <!-- STEP 3: TRACKS LIST -->
  <section class="hidden" id="songsSection">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 style="font-size:15px; font-weight:700;">Verified Tracks (5.1 Audio)</h2>
      <button type="button" class="btn" onclick="addManualTrack()">+ Add Custom Song</button>
    </div>
    <div class="card hidden" id="songsStateBlock" style="padding:25px; text-align:center;"></div>
    <div class="song-list" id="songList"></div>

    <div style="margin-top:24px;" class="hidden" id="saveAllBar">
      <button class="btn btn-cyan btn-block" id="saveAllBtn" onclick="saveAllSongsToChunk()">🚀 COMMIT ALBUM PACK TO chunks/data_c03.json</button>
      <div id="commitStatus" style="font-size:12px; text-align:center; margin-top:8px; color:var(--text-secondary);"></div>
    </div>
  </section>
</main>

<div id="laser-toast"></div>

<script>
const CONFIG = {
  TMDB_API_KEY: "051ccf72e026820cb53b8b8531b6a2ba",
  TMDB_BASE: "https://api.themoviedb.org/3",
  TMDB_IMG_POSTER: "https://image.tmdb.org/t/p/w500",
  TMDB_IMG_BACKDROP: "https://image.tmdb.org/t/p/original",
  TMDB_IMG_THUMB: "https://image.tmdb.org/t/p/w780",
  STREAMER_HOST: "https://gdrive-stream.moinudeentv.workers.dev/?id=",
  STREAM_HEADER: "|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0",
  GITHUB_OWNER: "Moinuflix",
  GITHUB_REPOSITORY: "My-Movies",
  GITHUB_BRANCH: "main",
  GITHUB_TARGET_FILE: "chunks/data_c03.json",
  TOKEN_KEY: "moinuflix_gh_token"
};

let state = { selectedMovie: null, songs: [] };

function showToast(msg, isError = false) {
  const t = document.getElementById("laser-toast");
  t.textContent = (isError ? "❌ " : "⚡ ") + msg;
  t.style.borderColor = isError ? "var(--error)" : "var(--laser-cyan)";
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3500);
}

function normalize(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

document.getElementById("tokenConfigBtn").addEventListener("click", () => {
  const token = prompt("Enter your GitHub Token (ghp_...):", localStorage.getItem(CONFIG.TOKEN_KEY) || "");
  if (token !== null) {
    localStorage.setItem(CONFIG.TOKEN_KEY, token.trim());
    showToast("GitHub Token Saved!");
  }
});

// TMDB Search
let searchTimer = null;
document.getElementById("movieSearchInput").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  const box = document.getElementById("searchResults");
  if (!q) { box.classList.remove("open"); return; }
  searchTimer = setTimeout(async () => {
    box.innerHTML = '<div style="padding:12px;"><span class="spinner"></span>Searching catalog…</div>';
    box.classList.add("open");
    try {
      const res = await fetch(`${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_API_KEY}&query=${encodeURIComponent(q)}&region=IN&include_adult=false`);
      const data = await res.json();
      const results = data.results || [];
      box.innerHTML = "";
      results.slice(0, 8).forEach(m => {
        const item = document.createElement("div");
        item.className = "search-result-item";
        item.innerHTML = `
          <img class="search-result-poster" src="${m.poster_path ? CONFIG.TMDB_IMG_POSTER + m.poster_path : ''}" />
          <div>
            <div style="font-weight:700; font-size:14px;">${m.title}</div>
            <div style="font-size:12px; color:var(--text-secondary);">${m.release_date ? m.release_date.slice(0,4) : '—'} • ${(m.original_language || 'IN').toUpperCase()} • TMDB #${m.id}</div>
          </div>`;
        item.addEventListener("click", () => selectMovie(m));
        box.appendChild(item);
      });
    } catch (e) { box.innerHTML = '<div style="padding:12px;">Error loading search.</div>'; }
  }, 300);
});

async function selectMovie(m) {
  document.getElementById("searchResults").classList.remove("open");
  document.getElementById("movieSearchInput").value = m.title;
  const year = m.release_date ? m.release_date.slice(0, 4) : "2011";
  const poster = m.poster_path ? `${CONFIG.TMDB_IMG_POSTER}${m.poster_path}` : "";
  const fanart = m.backdrop_path ? `${CONFIG.TMDB_IMG_BACKDROP}${m.backdrop_path}` : poster;
  const thumb = m.backdrop_path ? `${CONFIG.TMDB_IMG_THUMB}${m.backdrop_path}` : poster;

  state.selectedMovie = {
    id: m.id,
    title: m.title,
    original_title: m.original_title || m.title,
    year: year,
    language: (m.original_language || "ta").toLowerCase(),
    poster: poster,
    fanart: fanart,
    thumbnail: thumb
  };

  document.getElementById("movieSummary").classList.add("visible");
  document.getElementById("movieSummaryBackdrop").style.backgroundImage = `url('${fanart}')`;
  document.getElementById("movieSummaryPoster").src = poster;
  document.getElementById("movieSummaryTitle").textContent = m.title;
  document.getElementById("movieSummaryYear").textContent = year;
  document.getElementById("movieSummaryId").textContent = "TMDB #" + m.id;
  document.getElementById("movieSummaryLang").textContent = state.selectedMovie.language.toUpperCase();

  document.getElementById("folderSection").classList.remove("hidden");
  document.getElementById("songsSection").classList.remove("hidden");

  loadTracksForMovie(state.selectedMovie);
}

function loadTracksForMovie(movie) {
  const cleanM = normalize(movie.title);
  let list = [];

  if(cleanM.includes("engeyumkadhal")) {
    list = [
      { title: "Engeyum Kadhal", artist: "Aalap Raju, Devan Ekambaram, Ranina Reddy" },
      { title: "Thendral Ennum", artist: "P. Unnikrishnan, Harris Jayaraj" },
      { title: "Nenjil Nenjil", artist: "Harish Raghavendra, Chinmayi" },
      { title: "Dhimu Dhimu", artist: "Karthik" },
      { title: "Kulu Kulu Venpani", artist: "Karthik, Ranina Reddy" },
      { title: "Bathing at Cannes", artist: "Emcee Jesz, Kash, Ranina Reddy" },
      { title: "Lolita", artist: "Karthik, Prashanthini" }
    ];
  } else if(cleanM.includes("paiyaa")) {
    list = [
      { title: "Thuli Thuli", artist: "Haricharan, Tanvi Shah" },
      { title: "Adada Mazhaida", artist: "Rahul Nambiar, Saindhavi" },
      { title: "En Kadhal Solla", artist: "Yuvan Shankar Raja" },
      { title: "Poongatre Poongatre", artist: "Benny Dayal" }
    ];
  } else {
    list = [
      { title: movie.title + " Song 1", artist: "Soundtrack" },
      { title: movie.title + " Song 2", artist: "Soundtrack" }
    ];
  }

  state.songs = list.map(s => ({
    title: s.title,
    artist: s.artist,
    audio: "5.1 Surround DTS-HD",
    drive_id: "",
    file_name: ""
  }));

  document.getElementById("movieSummarySongCount").textContent = String(state.songs.length);
  renderSongList();
  showToast(`Loaded ${state.songs.length} verified tracks!`);
}

function renderSongList() {
  const box = document.getElementById("songList");
  box.innerHTML = "";
  state.songs.forEach((song, idx) => {
    const card = document.createElement("div");
    card.className = "song-card";
    card.innerHTML = `
      <div class="song-index">${String(idx + 1).padStart(2, '0')}</div>
      <img src="${state.selectedMovie.thumbnail}" class="song-thumb-preview" />
      <div class="song-body">
        <div>
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist} &bull; <span style="color:var(--laser-cyan);">${song.audio}</span></div>
        </div>
        
        <div class="song-link-row">
          <input type="text" class="input" style="font-family:monospace; font-size:13px;" placeholder="Drive ID (Auto-Synced from Action)" value="${song.drive_id || ''}" oninput="state.songs[${idx}].drive_id=this.value.trim(); renderSongList();">
        </div>

        <div class="song-status ${song.drive_id ? 'saved' : ''}">
          ${song.drive_id ? '✓ Real ID Linked: ' + song.drive_id + (song.file_name ? ' (' + song.file_name + ')' : '') : '⚠️ Waiting for Action Sync'}
        </div>
      </div>`;

    box.appendChild(card);
  });

  document.getElementById("saveAllBar").classList.remove("hidden");
}

// ⚡ DIRECT SYNC FROM GITHUB ACTION OUTPUT
async function syncFromGitHubAction() {
  const notice = document.getElementById("syncNotice");
  notice.textContent = "Fetching extracted_tracks.json from repo...";
  showToast("Reading GitHub Action output file...");

  try {
    const url = `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPOSITORY}/${CONFIG.GITHUB_BRANCH}/extracted_tracks.json?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) {
      showToast("extracted_tracks.json not found! Run the Action first.", true);
      notice.textContent = "Action file not found yet.";
      return;
    }

    const files = await res.json();
    let matched = 0;

    state.songs.forEach(song => {
      const cleanSong = normalize(song.title);
      const found = files.find(f => {
        const cleanName = normalize(f.name);
        return cleanName.includes(cleanSong) || cleanSong.includes(cleanName);
      });

      if (found) {
        song.drive_id = found.id;
        song.file_name = f.name;
        matched++;
      }
    });

    renderSongList();
    notice.textContent = `✓ Synced ${matched} tracks from Action!`;
    showToast(`🎯 Auto-matched ${matched} tracks from GitHub Action!`);
  } catch(e) {
    showToast("Error reading action file", true);
  }
}

function addManualTrack() {
  const t = prompt("Enter song name:");
  if (t && t.trim()) {
    state.songs.push({
      title: t.trim(),
      artist: state.selectedMovie ? state.selectedMovie.title + " Song" : "Original Track",
      audio: "5.1 Surround DTS-HD",
      drive_id: "",
      file_name: ""
    });
    document.getElementById("movieSummarySongCount").textContent = String(state.songs.length);
    renderSongList();
  }
}

// SAVE TO MASTER CHUNKS
async function saveAllSongsToChunk() {
  const token = localStorage.getItem(CONFIG.TOKEN_KEY);
  if (!token) return showToast("Set GitHub Token first!", true);
  if (!state.selectedMovie) return showToast("Select a movie first!", true);

  const validTracks = [];
  for (let i = 0; i < state.songs.length; i++) {
    const s = state.songs[i];
    if (s.drive_id && s.drive_id.length >= 25 && !s.drive_id.includes(".mkv")) {
      validTracks.push({
        id: s.drive_id,
        title: s.title,
        track_number: validTracks.length + 1,
        artist: s.artist,
        plot: `${state.selectedMovie.title} - ${s.title} Official 5.1 Surround Video Song.`,
        thumb: state.selectedMovie.thumbnail,
        fanart: state.selectedMovie.fanart,
        stream_url: `${CONFIG.STREAMER_HOST}${s.drive_id}${CONFIG.STREAM_HEADER}`,
        specs: {
          resolution: "1080p FHD",
          codec: "H.264",
          audio: s.audio || "5.1 Surround DTS-HD",
          channels: "5.1"
        }
      });
    }
  }

  if (!validTracks.length) return showToast("No valid Real Drive IDs attached!", true);

  const pack = {
    id: `album_${state.selectedMovie.id}`,
    title: `${state.selectedMovie.title} (5.1 Surround Soundtracks)`,
    original_title: state.selectedMovie.title,
    movie: state.selectedMovie.title,
    tmdb_id: state.selectedMovie.id,
    year: state.selectedMovie.year,
    rating: 8.5,
    plot: `${state.selectedMovie.title} Complete 5.1 Surround Master Video Pack.`,
    poster: state.selectedMovie.poster,
    fanart: state.selectedMovie.fanart,
    logo: state.selectedMovie.thumbnail,
    tracks: validTracks
  };

  showToast("Committing Album Pack to chunks/data_c03.json...");
  try {
    const url = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPOSITORY}/contents/${CONFIG.TARGET_CHUNK}`;
    let existing = [];
    let sha = null;
    const gRes = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (gRes.ok) {
      const meta = await gRes.json();
      sha = meta.sha;
      existing = JSON.parse(decodeURIComponent(escape(atob(meta.content))));
    }
    const idx = existing.findIndex(a => a.tmdb_id === state.selectedMovie.id || a.movie === state.selectedMovie.title);
    if (idx >= 0) existing[idx] = pack;
    else existing.unshift(pack);

    const bin = Array.from(new TextEncoder().encode(JSON.stringify(existing, null, 2))).map(b => String.fromCharCode(b)).join("");
    const pRes = await fetch(url, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `MoinuFlix: Ingest 5.1 Album Pack for ${state.selectedMovie.title}`,
        content: btoa(bin),
        branch: CONFIG.GITHUB_BRANCH,
        sha: sha
      })
    });
    if (!pRes.ok) throw new Error("Commit failed");
    showToast("🎉 Successfully Committed to chunks/data_c03.json!");
    document.getElementById("commitStatus").textContent = "✓ Saved & synced with GitHub chunks/data_c03.json";
  } catch(e) {
    showToast("GitHub Commit Failed!", true);
  }
}
</script>
</body>
</html>
