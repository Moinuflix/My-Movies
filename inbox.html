<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix - Drive Inbox & Arrivals</title>
  <style>
    :root {
      --bg: #0f1015;
      --card-bg: #181920;
      --accent: #e50914;
      --green: #2ecc71;
      --text: #f5f6fa;
      --text-muted: #8c909e;
      --border: #262833;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .btn-refresh { background: var(--border); color: var(--text); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-refresh:hover { background: #323544; }
    .inbox-list { display: flex; flex-direction: column; gap: 14px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .title { font-size: 16px; font-weight: 600; line-height: 1.4; color: #fff; word-break: break-all; }
    .badge-size { background: #e5091420; color: #ff4d58; border: 1px solid #e5091440; padding: 3px 8px; border-radius: 5px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .card-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
    .meta-select { background: #121318; border: 1px solid var(--border); color: #fff; padding: 5px 8px; border-radius: 5px; font-size: 13px; }
    .card-actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn-push { background: var(--green); color: #000; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; flex: 1; text-align: center; }
    .btn-push:hover { opacity: 0.9; }
    .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); font-size: 14px; background: var(--card-bg); border-radius: 10px; border: 1px dashed var(--border); }
    .status-badge { display: inline-block; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
    .status-ready { background: #2ecc7120; color: var(--green); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📥 Drive New Arrivals</h1>
    <button class="btn-refresh" onclick="loadArrivals()">🔄 Refresh List</button>
  </header>

  <div id="inbox-container" class="inbox-list">
    <div class="empty-state">Loading detected Google Drive files...</div>
  </div>
</div>

<script>
  // Repo details
  const REPO_BASE = "https://raw.githubusercontent.com/Moinuflix/My-Movies/main";
  const GITHUB_API_BASE = "https://api.github.com/repos/Moinuflix/My-Movies";

  async function loadArrivals() {
    const container = document.getElementById("inbox-container");
    container.innerHTML = '<div class="empty-state">Checking inbox_arrivals.json...</div>';

    try {
      const res = await fetch(`${REPO_BASE}/inbox_arrivals.json?t=${Date.now()}`);
      if (!res.ok) {
        container.innerHTML = '<div class="empty-state">No inbox_arrivals.json file found. Run GitHub Action first!</div>';
        return;
      }
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = '<div class="empty-state">🎉 All clear! No pending movies in inbox.</div>';
        return;
      }
      renderCards(data);
    } catch (e) {
      container.innerHTML = `<div class="empty-state">Error loading arrivals: ${e.message}</div>`;
    }
  }

  function renderCards(items) {
    const container = document.getElementById("inbox-container");
    container.innerHTML = "";

    items.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="card-top">
          <div class="title">${item.title}</div>
          <div class="badge-size">${item.size}</div>
        </div>
        <div class="card-meta">
          <span>Route To:</span>
          <select id="target-${index}" class="meta-select">
            <option value="chunks/data_c01_tamil.json" ${item.target_category === 'kollywood' ? 'selected' : ''}>Kollywood (Tamil)</option>
            <option value="chunks/data_c01_telugu.json" ${item.target_category === 'tollywood' ? 'selected' : ''}>Tollywood (Telugu)</option>
            <option value="chunks/data_c01_hindi.json" ${item.target_category === 'bollywood' ? 'selected' : ''}>Bollywood (Hindi)</option>
            <option value="chunks/data_c01_english.json" ${item.target_category === 'hollywood' ? 'selected' : ''}>Hollywood (English)</option>
          </select>
          <span class="status-badge status-ready">Clean ${item.size} Tag</span>
        </div>
        <div class="card-actions">
          <button class="btn-push" onclick="pushToCategory(${index})">⚡ 1-Click Push to JSON</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.inboxData = [];
  loadArrivals();
</script>

</body>
</html>
