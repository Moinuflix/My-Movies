<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoinuFlix — Advanced Ingest Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #040711;
      --bg-card: rgba(13, 22, 38, 0.88);
      --bg-input: #091224;
      --border-color: rgba(56, 189, 248, 0.2);
      --laser-cyan: #38bdf8;
      --laser-cyan-glow: rgba(56, 189, 248, 0.45);
      --laser-green: #10b981;
      --laser-green-glow: rgba(16, 185, 129, 0.35);
      --laser-red: #ef4444;
      --neon-gold: #f59e0b;
      --neon-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-stack: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 12% 12%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 88% 88%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-stack);
      padding: 1.5rem 1rem 6rem;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--laser-cyan);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .form-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.45rem; position: relative; }
    .full-width { grid-column: span 2; }
    label { font-size: 0.84rem; font-weight: 700; color: var(--text-muted); }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-stack);
    }
    input:focus, select:focus {
      border-color: var(--laser-cyan);
      box-shadow: 0 0 14px var(--laser-cyan-glow);
    }

    .smart-input {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.04);
    }

    /* OTT BADGE LIVE PREVIEW BOX */
    .ott-preview-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(9, 18, 36, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 16px;
      margin-top: 4px;
    }
    .ott-logo-img {
      height: 38px;
      max-width: 110px;
      object-fit: contain;
      background: transparent;
      padding: 2px;
    }

    .industry-checkbox-panel {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.75rem;
      background: rgba(11, 19, 41, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1rem;
      margin-top: 0.4rem;
    }
    .industry-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }
    .industry-check-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--laser-cyan);
      cursor: pointer;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--laser-cyan), #2563eb);
      color: #030712;
      border: none;
      padding: 0.95rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1.2rem;
      box-shadow: 0 0 20px var(--laser-cyan-glow);
      transition: transform 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); }

    .btn-batch {
      background: linear-gradient(135deg, var(--laser-green), #059669);
      color: #fff;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 14px var(--laser-green-glow);
    }

    .arrivals-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      margin-top: 0.8rem;
    }
    .arrivals-table th { padding: 10px; color: var(--text-dim); text-align: left; border-bottom: 1px solid var(--border-color); }
    .arrivals-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; }

    /* TMDB SEARCH DROPDOWN (TOP 3 WITH CLEAR ID BADGE) */
    .tmdb-results-box {
      display: none;
      margin-top: 8px;
      background: #091224;
      border: 1px solid var(--laser-cyan);
      box-shadow: 0 0 20px var(--laser-cyan-glow);
      border-radius: 14px;
      padding: 8px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 60;
    }
    .tmdb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .tmdb-item:hover {
      background: #1e293b;
      border-color: var(--laser-cyan);
    }
    .tmdb-poster {
      width: 44px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      background: #070d1e;
      flex-shrink: 0;
    }
    .tmdb-id-badge {
      background: rgba(56, 189, 248, 0.18);
      color: var(--laser-cyan);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    #laser-toast {
      position: fixed;
      top: 25px;
      right: 25px;
      background: rgba(13, 22, 38, 0.96);
      border: 1px solid var(--laser-cyan);
      box-shadow: 0 0 25px var(--laser-cyan-glow);
      color: #fff;
      padding: 1rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      display: none;
      z-index: 300;
    }

    @media (max-width: 650px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .industry-checkbox-panel { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <div id="laser-toast"></div>

  <header>
    <div>
      <a href="inbox.html" class="back-btn">⬅️ Back to Movies Dashboard</a>
      <h1 style="font-size: 1.7rem; margin-top: 4px;">🎬 Studio Movie Ingest & Arrivals</h1>
    </div>
    <div style="display:flex; gap:8px;">

    </div>

  <!-- 1. DRIVE ARRIVALS AUDIT -->
  <div class="form-container">

              <option value="BLURAY">BLURAY / Remux</option>
            </select>
            
            <div class="ott-preview-card">
              <span style="font-size:0.75rem; color:var(--text-dim);">Kodi OTT Logo:</span>
              <img id="ott-preview-img" class="ott-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="OTT Logo">
              <span id="ott-label" style="font-size:0.8rem; font-weight:800; color:var(--laser-green);">Netflix</span>
            </div>
          </div>
        </div>

        <!-- REGIONAL LANGUAGE CHUNKS -->
        <div class="form-group full-width">
          <label style="color: var(--neon-gold);">⚡ Sync to Language Chunks (chunks/data_c01_...):</label>
          <div class="industry-checkbox-panel">
            <label class="industry-check-label">
              <input type="checkbox" id="chk-kollywood" value="ta" checked>
              <span>🌴 Tamil (Kollywood)</span>
            </label>
            <label class="industry-check-label">
              <input type="checkbox" id="chk-tollywood" value="te">
              <span>🏛️ Telugu (Tollywood)</span>
            </label>
            <label class="industry-check-label">
              <input type="checkbox" id="chk-bollywood" value="hi">
              <span>✨ Hindi (Bollywood)</span>
            </label>
            <label class="industry-check-label">
              <input type="checkbox" id="chk-hollywood" value="en">
              <span>🌐 English (Hollywood)</span>
            </label>
            <label class="industry-check-label">
              <input type="checkbox" id="chk-mollywood" value="ml">
              <span>🥥 Malayalam (Mollywood)</span>
            </label>
            <label class="industry-check-label">
              <input type="checkbox" id="chk-sandalwood" value="kn">
              <span>🏔️ Kannada (Sandalwood)</span>
            </label>
          </div>
        </div>

        <!-- QUALITY DROPDOWN -->
        <div class="form-group">
          <label>Quality Format</label>
          <select id="in-quality" required>
            <option value="4K UHD" selected>4K UHD (2160p)</option>
            <option value="DS4K">DS4K (Downsampled 4K)</option>
            <option value="1080p FHD">1080p FHD</option>
            <option value="1080p 60fps">1080p 60fps</option>
            <option value="720p HD">720p HD</option>
          </select>
        </div>

        <!-- AUDIO DROPDOWN -->
        <div class="form-group">
          <label>Audio Format</label>
          <select id="in-audio" required>
            <option value="Dolby Atmos" selected>Dolby Atmos / TrueHD</option>
            <option value="DTS-HD Master / 1509k DTS">DTS-HD Master / 1509k DTS (Lossless)</option>
            <option value="Dolby Digital Plus">Dolby Digital Plus (DDP 5.1)</option>
            <option value="Dolby Digital">Dolby Digital (AC3 5.1)</option>
          </select>
        </div>

        <!-- CLEAN GB SIZE -->
        <div class="form-group">
          <label>Clean File Size (Auto-rounded e.g. 13.4 ➔ 13 GB, 13.6 ➔ 14 GB)</label>
          <input type="text" id="in-size" placeholder="e.g. 14 GB" required>
        </div>

        <!-- IMAX PUSH -->
        <div class="form-group">
          <label class="industry-check-label" style="background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); padding: 10px 14px; border-radius: 12px; margin-top:22px;">
            <input type="checkbox" id="chk-is-imax">
            <span style="color: var(--neon-gold); font-weight: 800;">⚡ Push to IMAX Core (data_c01_imax.json)</span>
          </label>
        </div>

        <!-- GDRIVE URL -->
        <div class="form-group full-width">
          <label>Google Drive Link or File ID</label>
          <input type="text" id="in-gdrive" placeholder="Paste full Google Drive link or File ID" required>
        </div>

      </div>

      <button type="submit" class="btn-submit">🚀 COMMIT TO MASTER & SYNC SELECTED CHUNKS</button>
    </form>
  </div>

  <script>
    const GH_REPO = 'Moinuflix/My-Movies';[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
    const GH_BRANCH = 'main';[span_5](start_span)[span_5](end_span)[span_6](start_span)[span_6](end_span)
    const RAW_BASE = `https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}`;
    const TMDB_API_KEY = '051ccf72e026820cb53b8b8531b6a2ba';
    const WORKER_BASE = 'https://gdrive-stream.moinudeentv.workers.dev/?id=';[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span)
    const USER_AGENT = '|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0';[span_9](start_span)[span_9](end_span)[span_10](start_span)[span_10](end_span)

    // High Quality Transparent ClearArt Logos for Kodi
    const OTT_LOGOS = {
      "Netflix": "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg",
      "Disney+ Hotstar": "https://upload.wikimedia.org/wikipedia/commons/1/1e/Disney%2B_Hotstar_logo.svg",
      "Prime Video": "https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png",
      "Sun NXT": "https://upload.wikimedia.org/wikipedia/en/thumb/f/f4/Sun_NXT_logo.svg/320px-Sun_NXT_logo.svg.png",
      "Aha": "https://upload.wikimedia.org/wikipedia/commons/6/6f/Aha_OTT_logo.png",
      "SonyLIV": "https://upload.wikimedia.org/wikipedia/commons/5/52/SonyLIV_logo.svg",
      "Zee5": "https://upload.wikimedia.org/wikipedia/commons/5/5a/Zee5-official-logo.jpeg",
      "JioCinema": "https://upload.wikimedia.org/wikipedia/commons/1/14/JioCinema_Logo.svg",
      "WEB-DL": "",
      "BLURAY": ""
    };

    let arrivalsList = [];
    let fetchedMeta = null;

    function getStoredToken() { return localStorage.getItem('moinuflix_gh_token') || ''; }
    function configureToken() {
      const cur = getStoredToken();
      const input = prompt('Enter GitHub PAT (ghp_...):', cur);
      if (input !== null) {
        localStorage.setItem('moinuflix_gh_token', input.trim());
        showLaserToast('GitHub Token Saved!');
      }
    }

    function showLaserToast(msg, isError = false) {
      const toast = document.getElementById('laser-toast');
      toast.style.borderColor = isError ? 'var(--laser-red)' : 'var(--laser-cyan)';
      toast.innerHTML = (isError ? '❌ ' : '⚡ ') + msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function extractGDriveId(url) {
      if (!url) return '';
      const pMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (pMatch) return pMatch[1];
      const fMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fMatch) return fMatch[1];
      return url.trim();
    }

    function updateOttLogoPreview(sourceVal) {
      const logoUrl = OTT_LOGOS[sourceVal] || "";
      const img = document.getElementById('ott-preview-img');
      const label = document.getElementById('ott-label');
      label.textContent = sourceVal;
      if (logoUrl) {
        img.src = logoUrl;
        img.style.display = 'inline-block';
      } else {
        img.style.display = 'none';
      }
    }

    // SMART CLEAN GB LOGIC (13.4 -> 13 GB, 13.6 -> 14 GB)
    function cleanRoundGB(rawSizeStr) {
      if (!rawSizeStr) return "10 GB";
      const m = String(rawSizeStr).match(/([\d\.]+)\s*(gb|mb)/i);
      if (m) {
        let val = parseFloat(m[1]);
        let unit = m[2].toLowerCase();
        if (unit === 'gb') {
          return `${Math.round(val)} GB`;
        } else {
          let inGb = val / 1024;
          return inGb >= 1 ? `${Math.round(inGb)} GB` : `${Math.round(val)} MB`;
        }
      }
      return rawSizeStr;
    }

    // AUTO-PARSE FILENAME
    function parseFileName(name) {
      if (!name) return;
      const fn = name.toLowerCase();

      // 1. Quality
      if (fn.includes('ds4k')) document.getElementById('in-quality').value = 'DS4K';
      else if (fn.includes('2160p') || fn.includes('4k') || fn.includes('uhd')) document.getElementById('in-quality').value = '4K UHD';
      else if (fn.includes('60fps') || fn.includes('60 fbs')) document.getElementById('in-quality').value = '1080p 60fps';
      else if (fn.includes('1080p') || fn.includes('fhd')) document.getElementById('in-quality').value = '1080p FHD';
      else if (fn.includes('720p')) document.getElementById('in-quality').value = '720p HD';

      // 2. OTT Source (SunNXT, Aha, Netflix, etc.)
      let detectedSource = 'WEB-DL';
      if (fn.includes('sunnxt') || fn.includes('sun nxt')) detectedSource = 'Sun NXT';
      else if (fn.includes('aha')) detectedSource = 'Aha';
      else if (fn.includes('nf') || fn.includes('netflix')) detectedSource = 'Netflix';
      else if (fn.includes('dsnp') || fn.includes('hotstar') || fn.includes('disney')) detectedSource = 'Disney+ Hotstar';
      else if (fn.includes('amzn') || fn.includes('prime')) detectedSource = 'Prime Video';
      else if (fn.includes('sonyliv') || fn.includes('sony')) detectedSource = 'SonyLIV';
      else if (fn.includes('zee5')) detectedSource = 'Zee5';
      else if (fn.includes('jio')) detectedSource = 'JioCinema';
      else if (fn.includes('bluray') || fn.includes('remux')) detectedSource = 'BLURAY';

      document.getElementById('in-source').value = detectedSource;
      updateOttLogoPreview(detectedSource);

      // 3. Audio
