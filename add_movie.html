      margin-top: 1.2rem;

    .btn-submit:hover { transform: translateY(-2px); }

    .btn-batch {

      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;

    .arrivals-table {

      font-size: 0.84rem;
      margin-top: 0.8rem;

    .arrivals-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: middle; }

    .tmdb-results-box {
      display: none;
      margin-top: 6px;
      background: #091224;
      border: 1px solid var(--laser-cyan);
      border-radius: 12px;
      padding: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 50;

    .tmdb-item {
      padding: 8px 10px;

      font-size: 0.85rem;
      color: #fff;

    .tmdb-item:hover { background: #1e293b; color: var(--laser-cyan); }

    #laser-toast {
      position: fixed;
      top: 25px;
      right: 25px;
      background: rgba(13, 22, 38, 0.96);
      border: 1px solid var(--laser-cyan);

      color: #fff;

      border-radius: 12px;
      font-weight: 700;
      display: none;
      z-index: 300;
    }

    @media (max-width: 650px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .industry-checkbox-panel { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    }
  </style>

    // SMART CLEAN GB LOGIC (13.4 -> 13 GB, 13.6 -> 14 GB)
    function cleanRoundGB(rawSizeStr) {
      if (!rawSizeStr) return "10 GB";
      const m = String(rawSizeStr).match(/([\d\.]+)\s*(gb|mb)/i);
      if (m) {
        let val = parseFloat(m[1]);
        let unit = m[2].toLowerCase();
        if (unit === 'gb') {
          return `${Math.round(val)} GB`;
        } else {
          let inGb = val / 1024;
          return inGb >= 1 ? `${Math.round(inGb)} GB` : `${Math.round(val)} MB`;
        }
      }
      return rawSizeStr;
    }

      else if (fn.includes('nf') || fn.includes('netflix')) document.getElementById('in-source').value = 'Netflix';

        </div>
      </div>
      <button type="submit" class="btn-submit">🚀 COMMIT TO MASTER (DATA_C01.JSON)</button>
    </form>
  </div>

  <script>
    const GH_REPO = 'Moinuflix/My-Movies';
    const GH_BRANCH = 'main';
    const RAW_BASE = `https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}`;
    const TMDB_API_KEY = '051ccf72e026820cb53b8b8531b6a2ba';
    const WORKER_BASE = 'https://gdrive-stream.moinudeentv.workers.dev/?id=';
    const USER_AGENT = '|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0';

    let arrivalsList = [];
    let fetchedMeta = null;

    function getStoredToken() { return localStorage.getItem('moinuflix_gh_token') || ''; }
    function configureToken() {
      const cur = getStoredToken();
      const input = prompt('Enter GitHub PAT (ghp_...):', cur);
      if (input !== null) {
        localStorage.setItem('moinuflix_gh_token', input.trim());
        showLaserToast('Token Saved!');
      }
    }
    function showLaserToast(msg, isError = false) {
      const toast = document.getElementById('laser-toast');
      toast.style.borderColor = isError ? 'var(--laser-red)' : 'var(--laser-cyan)';
      toast.innerHTML = (isError ? '❌ ' : '⚡ ') + msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }
    function extractGDriveId(url) {
      if (!url) return '';
      const pMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (pMatch) return pMatch[1];
      const fMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fMatch) return fMatch[1];
      return url.trim();
    }

    async function loadArrivals() {
      const tbody = document.getElementById('arrivals-tbody');
      try {
        const res = await fetch(`${RAW_BASE}/inbox_arrivals.json?t=${Date.now()}`);
        arrivalsList = res.ok ? await res.json() : [];
        if (!arrivalsList || arrivalsList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--laser-green); padding:20px;">🎉 100% Synced! No pending arrivals.</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        arrivalsList.forEach((it, idx) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight:600;">${it.title}</td>
            <td style="color:var(--laser-cyan);">${it.size || 'HD'}</td>
            <td style="text-align:right;">
              <button style="background:rgba(56,189,248,0.15); color:var(--laser-cyan); border:1px solid rgba(56,189,248,0.3); padding:4px 8px; border-radius:6px; cursor:pointer;" onclick="fillFormFromArrival(${idx})">Load ➔</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch(e) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--laser-red);">Error: ${e.message}</td></tr>`;
      }
    }

    function fillFormFromArrival(idx) {
      const it = arrivalsList[idx];
      if (!it) return;
      document.getElementById('in-filename').value = it.title;
      document.getElementById('in-gdrive').value = it.gdrive_id;
      if (it.size) document.getElementById('in-size').value = it.size;
      parseFileName(it.title);
      showLaserToast(`Loaded "${it.title}" into form`);
    }

    function parseFileName(name) {
      if (!name) return;
      const is4k = /2160p|4k/i.test(name);
      document.getElementById('in-quality').value = is4k ? '4K UHD' : '1080p FHD';
      if (/nf|netflix/i.test(name)) document.getElementById('in-source').value = 'Netflix';
      else if (/dsnp|hotstar/i.test(name)) document.getElementById('in-source').value = 'Disney+ Hotstar';
      else if (/amzn|prime/i.test(name)) document.getElementById('in-source').value = 'Prime Video';
    }

    async function fetchTmdb(tmdbId) {
      if (!tmdbId) return;
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_API_KEY}`);
        if (!res.ok) return;
        const d = await res.json();
        document.getElementById('in-collection').value = d.belongs_to_collection ? d.belongs_to_collection.name : '';
        fetchedMeta = {
          title: d.title, year: d.release_date ? parseInt(d.release_date.split('-')[0]) : 2024,
          poster: d.poster_path ? `https://image.tmdb.org/t/p/w500${d.poster_path}` : '',
          fanart: d.backdrop_path ? `https://image.tmdb.org/t/p/original${d.backdrop_path}` : '',
          tmdb_id: d.id, collection: d.belongs_to_collection ? d.belongs_to_collection.name : ''
        };
        showLaserToast(`Found: ${d.title}`);
      } catch(e) {}
    }

    async function handleMovieSubmit(e) {
      e.preventDefault();
      const token = getStoredToken();
      if (!token) return showLaserToast('Token required!', true);

      const fileId = extractGDriveId(document.getElementById('in-gdrive').value);
      if (!fileId) return showLaserToast('Invalid Drive ID', true);

      const tmdbId = document.getElementById('in-tmdb').value.trim();
      if (!fetchedMeta || String(fetchedMeta.tmdb_id) !== tmdbId) await fetchTmdb(tmdbId);

      const quality = document.getElementById('in-quality').value;
      const audio = document.getElementById('in-audio').value;
      const source = document.getElementById('in-source').value;
      const size = document.getElementById('in-size').value.trim() || '10 GB';
      const streamUrl = `${WORKER_BASE}${fileId}${USER_AGENT}`;

      const meta = fetchedMeta || { title: `Movie ${tmdbId}`, year: 2024, poster: '', tmdb_id: parseInt(tmdbId) };
      const newEntry = {
        id: fileId,
        name: `${meta.title} (${meta.year}) [${quality}] [${source}] [${audio}].mkv`,
        title: meta.title, year: meta.year, tmdb_id: meta.tmdb_id,
        collection: document.getElementById('in-collection').value.trim(),
        poster: meta.poster, fanart: meta.fanart || '',
        stream_url: streamUrl,
        specs: { resolution: quality, audio: audio, source: source, size: size },
        versions: [{ id: fileId, name: meta.title, quality: quality, source: source, size: size, stream_url: streamUrl }]
      };

      showLaserToast(`Committing "${meta.title}"...`);
      const masterRes = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/chunks/data_c01.json?t=${Date.now()}`);
      const masterData = masterRes.ok ? await masterRes.json() : [];
      masterData.unshift(newEntry);

      await commitFile('chunks/data_c01.json', masterData, `Add ${meta.title}`, token);
      showLaserToast(`🎉 "${meta.title}" committed!`);
      document.getElementById('movie-form').reset();
      loadArrivals();
    }

    async function batchSyncAllArrivals() {
      const token = getStoredToken();
      if (!token) return showLaserToast('Token required!', true);
      if (!arrivalsList || arrivalsList.length === 0) return showLaserToast('No arrivals to sync!', true);

      showLaserToast('Syncing all arrivals...');
      const masterRes = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/chunks/data_c01.json?t=${Date.now()}`);
      const masterData = masterRes.ok ? await masterRes.json() : [];

      arrivalsList.forEach(it => {
        const fileId = it.gdrive_id;
        const streamUrl = `${WORKER_BASE}${fileId}${USER_AGENT}`;
        masterData.unshift({
          id: fileId, name: it.title, title: it.title, year: 2024, tmdb_id: 0,
          collection: '', poster: '', stream_url: streamUrl,
          specs: { resolution: '1080p FHD', audio: 'Dolby Digital', source: 'WEB-DL', size: it.size || '3 GB' },
          versions: [{ id: fileId, name: it.title, stream_url: streamUrl }]
        });
      });

      await commitFile('chunks/data_c01.json', masterData, `Batch Sync ${arrivalsList.length} files`, token);
      await commitFile('inbox_arrivals.json', [], `Clear Inbox Arrivals`, token);
      showLaserToast('✅ All arrivals synced to Master!');
      loadArrivals();
    }

    async function commitFile(path, data, msg, token) {
      const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
      let sha = undefined;
      try {
        const r = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (r.ok) sha = (await r.json()).sha;
      } catch(e) {}

      const jsonStr = JSON.stringify(data, null, 2);
      const uint8 = new TextEncoder().encode(jsonStr);
      let binary = '';
      for (let i = 0; i < uint8.byteLength; i++) binary += String.fromCharCode(uint8[i]);

      await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, content: btoa(binary), branch: GH_BRANCH, sha: sha })
      });
    }

    window.addEventListener('DOMContentLoaded', loadArrivals);
  </script>
</body>
</html>
