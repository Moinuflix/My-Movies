<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoinuFlix — 5.1 Soundtrack Studio Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030611;
      --bg-card: rgba(10, 18, 38, 0.92);
      --bg-input: #060c1d;
      --border-color: rgba(56, 189, 248, 0.22);
      --laser-green: #10b981;
      --laser-green-glow: rgba(16, 185, 129, 0.5);
      --laser-cyan: #38bdf8;
      --laser-cyan-glow: rgba(56, 189, 248, 0.55);
      --laser-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-stack: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(56, 189, 248, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-stack);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOP 3D LASER PROGRESS NOTIFICATION */
    #laser-progress-bar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(3, 6, 17, 0.8);
      z-index: 2000;
      display: none;
    }
    #laser-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--laser-green), var(--laser-cyan));
      box-shadow: 0 0 16px var(--laser-cyan-glow), 0 0 30px var(--laser-green-glow);
      transition: width 0.2s ease-out;
    }
    #laser-progress-label {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 14, 30, 0.98);
      border: 1px solid var(--laser-cyan);
      box-shadow: 0 0 25px var(--laser-cyan-glow);
      border-radius: 30px;
      padding: 6px 20px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 2001;
      backdrop-filter: blur(16px);
    }
    #laser-progress-pct {
      font-family: var(--font-mono);
      color: var(--laser-green);
      font-size: 0.9rem;
    }

    aside {
      width: 270px;
      background: rgba(6, 12, 28, 0.95);
      backdrop-filter: blur(25px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.2rem;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0 0.5rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.25rem;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--laser-green), var(--laser-cyan));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      color: #030712;
      box-shadow: 0 0 25px var(--laser-green-glow);
    }
    .brand-text { font-size: 1.3rem; font-weight: 800; }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .nav-btn {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.75rem 0.95rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(56, 189, 248, 0.08); color: #fff; }
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(56, 189, 248, 0.12));
      color: #fff;
      border: 1px solid var(--laser-green);
      box-shadow: 0 0 20px var(--laser-green-glow);
    }

    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 1.25rem; }
    .btn-token-config {
      width: 100%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--laser-green);
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    main {
      margin-left: 270px;
      flex: 1;
      padding: 2.5rem 3rem 6rem;
      max-width: 1440px;
      width: calc(100% - 270px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1.25rem;
    }

    .form-container {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 2.2rem 2.6rem;
      max-width: 980px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.6);
      margin-bottom: 2.5rem;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .full-width { grid-column: span 2; }
    label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-stack);
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--laser-green);
      box-shadow: 0 0 16px var(--laser-green-glow);
    }

    .search-action-wrap {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn-search-trigger {
      background: linear-gradient(135deg, var(--laser-cyan), #0284c7);
      color: #030712;
      border: none;
      border-radius: 12px;
      padding: 0 1.5rem;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* SEARCH RESULTS DISPLAY */
    .tmdb-results-box {
      display: none;
      margin-top: 12px;
      background: #081024;
      border: 1px solid var(--laser-cyan);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
      border-radius: 14px;
      padding: 10px;
      max-height: 360px;
      overflow-y: auto;
    }
    .tmdb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid transparent;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.02);
    }
    .tmdb-item:hover { background: #162544; border-color: var(--laser-cyan); }
    .tmdb-poster { width: 44px; height: 62px; border-radius: 6px; object-fit: cover; background: #0c1836; flex-shrink: 0; }
    .tmdb-badge {
      background: rgba(56, 189, 248, 0.18);
      color: var(--laser-cyan);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.78rem;
      margin-left: auto;
    }

    .confirmed-movie-badge {
      display: none;
      align-items: center;
      gap: 14px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--laser-green);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 8px;
    }
    .confirmed-movie-img { width: 48px; height: 68px; border-radius: 8px; object-fit: cover; }

    /* EDIT PANEL */
    #song-edit-panel {
      display: none;
      background: rgba(6, 12, 28, 0.95);
      border: 1px dashed var(--laser-green);
      border-radius: 16px;
      padding: 1.4rem;
      margin-top: 1rem;
      gap: 1rem;
      flex-direction: column;
    }
    .song-edit-preview-row { display: flex; align-items: center; gap: 14px; }
    .song-edit-thumb { 
      width: 60px; 
      height: 60px; 
      border-radius: 10px; 
      object-fit: cover; 
      border: 1px solid var(--laser-cyan);
      background-color: #0c1836;
    }

    .btn-add-to-pack {
      background: rgba(16, 185, 129, 0.2);
      color: var(--laser-green);
      border: 1px solid var(--laser-green);
      padding: 0.9rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add-to-pack:hover { background: var(--laser-green); color: #030712; }

    /* STAGED PACK PREVIEW */
    .staged-pack-container {
      margin-top: 1.5rem;
      background: rgba(9, 16, 34, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.2rem;
    }
    .staged-track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .btn-submit-pack {
      background: linear-gradient(135deg, var(--laser-green), var(--laser-cyan));
      color: #030712;
      border: none;
      padding: 1rem;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1.25rem;
      box-shadow: 0 0 25px var(--laser-green-glow);
    }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.75rem; }
    .soundtrack-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .soundtrack-card:hover {
      border-color: var(--laser-green);
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 25px var(--laser-green-glow);
    }
    .poster-wrap { width: 100%; height: 250px; background: #081024; position: relative; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; }
    .pack-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(56, 189, 248, 0.25);
      border: 1px solid var(--laser-cyan);
      color: var(--laser-cyan);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }
    .soundtrack-card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 6px; }

    #laser-toast {
      position: fixed;
      top: 25px;
      right: 25px;
      background: rgba(10, 18, 38, 0.96);
      border: 1px solid var(--laser-green);
      box-shadow: 0 0 25px var(--laser-green-glow);
      color: #fff;
      padding: 1rem 1.4rem;
      border-radius: 12px;
      font-weight: 700;
      display: none;
      z-index: 3000;
    }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      aside { width: 100%; height: auto; position: sticky; top: 0; padding: 0.75rem 1rem; border-right: none; border-bottom: 1px solid var(--border-color); }
      .brand { margin-bottom: 0.5rem; padding-bottom: 0.5rem; }
      .nav-list { flex-direction: row; overflow-x: auto; }
      .nav-btn { white-space: nowrap; padding: 0.5rem 0.8rem; }
      .sidebar-footer { display: none; }
      main { margin-left: 0; width: 100%; padding: 1.2rem 1rem 6rem; }
      .form-container { padding: 1.4rem 1.1rem; }
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
    }
  </style>
</head>

            <div class="form-group">

                <option value="JioSaavn Hi-Res">JioSaavn Hi-Res</option>
                <option value="Tidal Master">Tidal Master</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-top:10px;">
            <label style="color:var(--laser-cyan);">Google Drive Link or File ID for this Song:</label>

          <button type="button" class="btn-add-to-pack" onclick="addCurrentSongToStaging()">

        </div>

        <!-- STEP 4: PACK STAGING PREVIEW & PUSH -->

      } catch(err) {
        updateLaserProgress(100, 'Push Failed');
        showLaserToast(`Error: ${err.message}`, true);
      }
    }

    // 7. LOAD VAULT
    async function loadAllSongs() {
      updateTokenBadge();
      updateLaserProgress(30, 'Reading Library...');
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/${GH_BRANCH}/chunks/data_c03.json?t=${Date.now()}`);[span_28](start_span)[span_28](end_span)[span_29](start_span)[span_29](end_span)
        songsData = res.ok ? await res.json() : [];
      } catch(e) {
        songsData = [];
      }
      updateLaserProgress(80, 'Rendering Packs...');
      renderSoundtracksGrid();
      updateLaserProgress(100, 'Vault Synced');
    }

    function renderSoundtracksGrid() {
      const container = document.getElementById('soundtracks-grid');
      container.innerHTML = '';

      if (!songsData || songsData.length === 0) {
        container.innerHTML = '<div style="color:var(--text-dim); padding:20px;">No soundtracks found in chunks/data_c03.json</div>';[span_30](start_span)[span_30](end_span)[span_31](start_span)[span_31](end_span)
        return;
      }

      songsData.forEach((pack, index) => {
        const card = document.createElement('div');
        card.className = 'soundtrack-card';
        card.innerHTML = `
          <div class="poster-wrap">
            <span class="pack-badge">⚡ ${pack.tracks ? pack.tracks.length : (pack.total_tracks || 1)} TRACKS</span>
            ${pack.poster ? `<img src="${pack.poster}" class="poster-img" loading="lazy">` : ''}
          </div>
          <div class="soundtrack-card-body">
            <div style="font-weight:800; font-size:1.05rem; color:#fff;">${escapeHtml(pack.movie || pack.title)}</div>
            <div style="font-size:0.75rem; color:var(--text-dim);">Year: ${pack.year || '2024'} • 5.1 Lossless</div>
            <button class="btn-token-config" style="margin-top:8px; padding:6px;" onclick="deletePack(${index}, '${escapeHtml(pack.movie)}')">🗑️ Delete Pack</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function deletePack(idx, title) {
      const pin = prompt(`Delete "${title}" Soundtrack Pack?\nEnter confirmation PIN:`);
      if (pin !== CONFIRM_PASS) return showLaserToast('Incorrect PIN!', true);
      const token = getStoredToken();
      if (!token) return showLaserToast('Token required!', true);

      songsData.splice(idx, 1);
      updateLaserProgress(40, `Deleting "${title}"...`);
      await commitFileDirect('chunks/data_c03.json', songsData, `Delete ${title}`, token);[span_32](start_span)[span_32](end_span)[span_33](start_span)[span_33](end_span)
      updateLaserProgress(100, 'Deleted');
      showLaserToast(`Deleted "${title}"`);
      loadAllSongs();
    }

    async function commitFileDirect(chunkPath, arrayData, message, token) {
      const url = `https://api.github.com/repos/${GH_REPO}/contents/${chunkPath}`;
      let currentSha = undefined;
      try {
        const getRes = await fetch(`${url}?t=${Date.now()}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (getRes.ok) currentSha = (await getRes.json()).sha;
      } catch(e) {}

      const finalJson = JSON.stringify(arrayData, null, 2);
      const uint8Array = new TextEncoder().encode(finalJson);
      let binary = '';
      for (let i = 0; i < uint8Array.byteLength; i++) binary += String.fromCharCode(uint8Array[i]);

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: message, content: btoa(binary), branch: GH_BRANCH, sha: currentSha })
      });

      if (!putRes.ok) {
        const err = await putRes.json();
        throw new Error(err.message || `Commit failed for ${chunkPath}`);
      }
    }

    window.addEventListener('DOMContentLoaded', loadAllSongs);
  </script>
