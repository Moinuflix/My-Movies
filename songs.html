<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Songs Manager · MoinuFlix</title>
  <style>
    /* =========================================================
       MoinuFlix — Songs Manager (Horizon 2 & Kodi Fanart Ready)
       ========================================================= */

    :root {
      --bg: #0a0a0a;
      --bg-elevated: #131313;
      --card: #161616;
      --card-hover: #1c1c1c;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text-primary: #f5f5f3;
      --text-secondary: #9a9a94;
      --text-tertiary: #6b6b66;
      --gold: #cfa15a;
      --gold-soft: rgba(207, 161, 90, 0.14);
      --gold-border: rgba(207, 161, 90, 0.35);
      --success: #6fae7a;
      --success-soft: rgba(111, 174, 122, 0.14);
      --error: #c96a5a;
      --error-soft: rgba(201, 106, 90, 0.14);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* Layout */
    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 0 0 12px;
      letter-spacing: 0.01em;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 10, 10, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .brand-name span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-nav {
      display: flex;
      gap: 4px;
    }

    .main-nav a {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
    }

    .main-nav a:hover {
      color: var(--text-primary);
      background: var(--card);
    }

    .main-nav a.active {
      color: var(--bg);
      background: var(--gold);
      font-weight: 600;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 18px;
    }

    /* Search */
    .search-row {
      position: relative;
      display: flex;
      gap: 10px;
    }

    .input,
    .text-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      font-size: 14px;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }

    .input:focus,
    .text-input:focus {
      outline: none;
      border-color: var(--gold-border);
      background: #171512;
    }

    .input::placeholder,
    .text-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      max-height: 340px;
      overflow-y: auto;
      z-index: 30;
      display: none;
    }

    .search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      gap: 12px;
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s var(--ease);
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: var(--card-hover);
    }

    .search-result-poster {
      width: 38px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .search-result-meta {
      min-width: 0;
    }

    .search-result-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-year {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .search-empty-state {
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* Selected Movie Summary with Backdrop */
    .movie-summary {
      display: none;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
    }

    .movie-summary.visible {
      display: block;
    }

    .movie-summary-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.25) blur(1px);
      z-index: 1;
    }

    .movie-summary-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.65) 60%, rgba(10,10,10,0.85) 100%);
      z-index: 2;
    }

    .movie-summary-content {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 18px;
      padding: 18px;
    }

    .movie-summary-poster {
      width: 92px;
      height: 138px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: #1e1e1e;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: var(--shadow);
    }

    .movie-summary-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
    }

    .movie-summary-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .movie-summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 4px;
    }

    .meta-chip {
      font-size: 11.5px;
      color: var(--text-secondary);
      background: rgba(19, 19, 19, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .meta-chip.gold {
      color: var(--gold);
      border-color: var(--gold-border);
      background: var(--gold-soft);
    }

    /* State Block */
    .state-block {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .state-block .state-icon {
      font-size: 22px;
      margin-bottom: 10px;
      opacity: 0.7;
    }

    .state-block.error {
      color: var(--error);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--gold);
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Song List */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }

    .song-card:hover {
      border-color: var(--border-strong);
      background: var(--card-hover);
    }

    .song-index {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .song-thumb-preview {
      width: 80px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .song-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-title-row {
      display: flex;
      flex-direction: column;
    }

    .song-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-link-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .song-link-input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      font-size: 13px;
    }

    .song-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .song-status {
      font-size: 11.5px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .song-status.saved { color: var(--success); }
    .song-status.unsaved { color: var(--text-tertiary); }
    .song-status.error { color: var(--error); }

    /* Buttons */
    .btn {
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease),
        transform 0.1s var(--ease), opacity 0.2s var(--ease);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: var(--border-strong);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1305;
    }

    .btn-gold:hover {
      background: #dbb06c;
      border-color: #dbb06c;
    }

    .btn-save {
      padding: 8px 14px;
      min-width: 72px;
    }

    .btn-block {
      width: 100%;
      padding: 15px;
      font-size: 14px;
      border-radius: var(--radius-md);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--card-hover);
      color: var(--text-primary);
    }

    /* JSON Preview Panel */
    .json-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
    }

    .json-toggle-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .json-toggle-icon {
      color: var(--text-tertiary);
      transition: transform 0.25s var(--ease);
      font-size: 13px;
    }

    .json-panel.open .json-toggle-icon {
      transform: rotate(180deg);
    }

    .json-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s var(--ease);
    }

    .json-panel.open .json-body {
      max-height: 540px;
    }

    .json-body pre {
      margin: 0;
      padding: 0 18px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #c9c6ba;
      overflow-x: auto;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }

    /* Save All Bar */
    .save-all-bar {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .commit-status {
      font-size: 12.5px;
      color: var(--text-tertiary);
      text-align: center;
      min-height: 16px;
    }

    .commit-status.success { color: var(--success); }
    .commit-status.error { color: var(--error); }

    /* Toasts */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(360px, calc(100vw - 32px));
      align-items: center;
    }

    .toast {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toast-in 0.25s var(--ease);
    }

    .toast.success { border-color: rgba(111, 174, 122, 0.4); }
    .toast.error { border-color: rgba(201, 106, 90, 0.4); }

    .toast-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    .toast.success .toast-dot { background: var(--success); }
    .toast.error .toast-dot { background: var(--error); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .main-nav { display: none; }
      .nav-toggle { display: flex; }
      .main-nav.open {
        display: flex;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border);
        padding: 8px;
        gap: 2px;
      }
      .movie-summary-content { flex-direction: column; }
      .movie-summary-poster { width: 90px; height: 135px; }
      .song-card { flex-direction: column; align-items: stretch; }
      .song-thumb-preview { width: 100%; height: 160px; }
      .song-index { align-self: flex-start; }
      .song-link-row { flex-direction: column; align-items: stretch; }
      .btn-save { width: 100%; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-name">Moinu<span>Flix</span></div>
      <div class="brand-sub">Songs Studio · 5.1 Kodi Fanart</div>
    </div>

    <div class="header-actions">
      <nav class="main-nav" id="mainNav">
        <a href="inbox.html">Movies</a>
        <a href="songs.html" class="active">Songs</a>
        <a href="series.html">Series</a>
        <a href="management.html">Management</a>
      </nav>
      <button type="button" class="btn btn-ghost" id="tokenConfigBtn" style="padding: 6px 12px; font-size: 12px;">🔑 Token</button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </div>
  </div>
</header>

<main class="page">
  <!-- Movie Search -->
  <section class="section">
    <h2 class="section-title">Search Movie</h2>
    <div class="search-row">
      <input
        type="text"
        id="movieSearchInput"
        class="input"
        placeholder="Type movie name (e.g. Ko, Paiyaa, Leo, Jailer)..."
        autocomplete="off"
      />
      <div class="search-results" id="searchResults"></div>
    </div>
  </section>

  <!-- Selected Movie Summary with Fanart Backdrop -->
  <section class="section">
    <div class="movie-summary" id="movieSummary">
      <div class="movie-summary-backdrop" id="movieSummaryBackdrop"></div>
      <div class="movie-summary-overlay"></div>
      <div class="movie-summary-content">
        <img class="movie-summary-poster" id="movieSummaryPoster" alt="" />
        <div class="movie-summary-body">
          <div class="movie-summary-title" id="movieSummaryTitle"></div>
          <div class="movie-summary-grid">
            <span class="meta-chip" id="movieSummaryYear"></span>
            <span class="meta-chip" id="movieSummaryId"></span>
            <span class="meta-chip" id="movieSummaryLang"></span>
            <span class="meta-chip gold">
              <span id="movieSummarySongCount">0</span> songs
            </span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Verified Tracklist -->
  <section class="section hidden" id="songsSection">
    <h2 class="section-title">Soundtrack &amp; Horizon 2 Fanart</h2>

    <div class="card hidden" id="songsStateBlock"></div>
    <div class="song-list" id="songList"></div>

    <div class="save-all-bar hidden" id="saveAllBar">
      <button class="btn btn-gold btn-block" id="saveAllBtn">Save All to chunks/data_c03.json</button>
      <div class="commit-status" id="commitStatus"></div>
    </div>
  </section>

  <!-- JSON Output Panel -->
  <section class="section">
    <div class="card json-panel" id="jsonPanel">
      <div class="json-toggle" id="jsonToggle">
        <span class="json-toggle-title">JSON Preview (Fanart &amp; Stream URLs Included)</span>
        <span class="json-toggle-icon">▾</span>
      </div>
      <div class="json-body">
        <pre id="jsonOutput">// Select a movie to preview its song data</pre>
      </div>
    </div>
  </section>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  "use strict";

  const CONFIG = {
    TMDB_API_KEY: "051ccf72e026820cb53b8b8531b6a2ba",
    TMDB_BASE: "https://api.themoviedb.org/3",
    TMDB_IMG_POSTER: "https://image.tmdb.org/t/p/w500",
    TMDB_IMG_BACKDROP: "https://image.tmdb.org/t/p/original",
    TMDB_IMG_THUMB: "https://image.tmdb.org/t/p/w780",

    // Cloudflare Stream Worker Endpoint
    STREAMER_HOST: "https://gdrive-stream.moinudeentv.workers.dev",
    STREAM_HEADER: "|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0",

    GITHUB_OWNER: "Moinuflix",
    GITHUB_REPOSITORY: "My-Movies",
    GITHUB_BRANCH: "main",
    GITHUB_TARGET_FILE: "chunks/data_c03.json",
    TOKEN_KEY: "moinuflix_gh_token",

    SEARCH_DEBOUNCE_MS: 350,
  };

  const state = {
    selectedMovie: null,
    songs: [],
    isCommitting: false
  };

  const els = {
    navToggle: document.getElementById("navToggle"),
    mainNav: document.getElementById("mainNav"),
    tokenConfigBtn: document.getElementById("tokenConfigBtn"),

    movieSearchInput: document.getElementById("movieSearchInput"),
    searchResults: document.getElementById("searchResults"),

    movieSummary: document.getElementById("movieSummary"),
    movieSummaryBackdrop: document.getElementById("movieSummaryBackdrop"),
    movieSummaryPoster: document.getElementById("movieSummaryPoster"),
    movieSummaryTitle: document.getElementById("movieSummaryTitle"),
    movieSummaryYear: document.getElementById("movieSummaryYear"),
    movieSummaryId: document.getElementById("movieSummaryId"),
    movieSummaryLang: document.getElementById("movieSummaryLang"),
    movieSummarySongCount: document.getElementById("movieSummarySongCount"),

    songsSection: document.getElementById("songsSection"),
    songList: document.getElementById("songList"),
    songsStateBlock: document.getElementById("songsStateBlock"),

    jsonPanel: document.getElementById("jsonPanel"),
    jsonToggle: document.getElementById("jsonToggle"),
    jsonOutput: document.getElementById("jsonOutput"),

    saveAllBar: document.getElementById("saveAllBar"),
    saveAllBtn: document.getElementById("saveAllBtn"),
    commitStatus: document.getElementById("commitStatus"),

    toastContainer: document.getElementById("toastContainer"),
  };

  function toast(message, type) {
    const node = document.createElement("div");
    node.className = "toast" + (type ? " " + type : "");
    node.innerHTML = '<span class="toast-dot"></span><span></span>';
    node.querySelector("span:last-child").textContent = message;
    els.toastContainer.appendChild(node);
    setTimeout(() => {
      node.style.opacity = "0";
      node.style.transition = "opacity 0.25s ease";
      setTimeout(() => node.remove(), 260);
    }, 3200);
  }

  // Google Drive File ID & Stream URL Extraction
  function extractDriveId(url) {
    if (!url) return "";
    const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                  url.match(/id=([a-zA-Z0-9_-]+)/) || 
                  url.match(/^([a-zA-Z0-9_-]{25,})$/);
    return match ? match[1] : "";
  }

  function generateStreamUrl(driveUrl) {
    const fileId = extractDriveId(driveUrl);
    if (!fileId) return "";
    return `${CONFIG.STREAMER_HOST}/${fileId}${CONFIG.STREAM_HEADER}`;
  }

  // GitHub Token Config
  els.tokenConfigBtn.addEventListener("click", () => {
    const existing = localStorage.getItem(CONFIG.TOKEN_KEY) || "";
    const token = prompt("Enter your GitHub Personal Access Token (ghp_...):", existing);
    if (token !== null) {
      localStorage.setItem(CONFIG.TOKEN_KEY, token.trim());
      toast(token ? "GitHub Token Saved!" : "Token Cleared", "success");
    }
  });

  if (els.navToggle) {
    els.navToggle.addEventListener("click", () => {
      els.mainNav.classList.toggle("open");
    });
  }

  // TMDB Movie Search Logic
  let searchDebounceTimer = null;
  let activeSearchController = null;

  els.movieSearchInput.addEventListener("input", () => {
    const query = els.movieSearchInput.value.trim();
    clearTimeout(searchDebounceTimer);

    if (!query) {
      closeSearchResults();
      return;
    }

    searchDebounceTimer = setTimeout(() => {
      runMovieSearch(query);
    }, CONFIG.SEARCH_DEBOUNCE_MS);
  });

  document.addEventListener("click", (e) => {
    if (!els.searchResults.contains(e.target) && e.target !== els.movieSearchInput) {
      closeSearchResults();
    }
  });

  function closeSearchResults() {
    els.searchResults.classList.remove("open");
    els.searchResults.innerHTML = "";
  }

  async function runMovieSearch(query) {
    if (activeSearchController) activeSearchController.abort();
    activeSearchController = new AbortController();

    renderSearchState("loading");

    try {
      const url = `${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
      const res = await fetch(url, { signal: activeSearchController.signal });
      if (!res.ok) throw new Error("TMDB search failed");
      const data = await res.json();
      const results = (data.results || []).slice(0, 8);

      if (!results.length) {
        renderSearchState("empty");
        return;
      }
      renderSearchResults(results);
    } catch (err) {
      if (err.name === "AbortError") return;
      renderSearchState("error", "Failed to load movies.");
    }
  }

  function renderSearchState(mode, message) {
    els.searchResults.classList.add("open");
    if (mode === "loading") {
      els.searchResults.innerHTML = '<div class="search-empty-state"><span class="spinner"></span>Searching movies…</div>';
    } else if (mode === "empty") {
      els.searchResults.innerHTML = '<div class="search-empty-state">No movies found.</div>';
    } else if (mode === "error") {
      els.searchResults.innerHTML = '<div class="search-empty-state">' + escapeHtml(message || "Search error.") + "</div>";
    }
  }

  function renderSearchResults(results) {
    els.searchResults.innerHTML = "";
    results.forEach((movie) => {
      const item = document.createElement("div");
      item.className = "search-result-item";
      const posterSrc = movie.poster_path ? `${CONFIG.TMDB_IMG_POSTER}${movie.poster_path}` : "";
      const year = movie.release_date ? movie.release_date.slice(0, 4) : "—";

      item.innerHTML = `
        <img class="search-result-poster" src="${posterSrc}" alt="" loading="lazy" />
        <div class="search-result-meta">
          <div class="search-result-title">${escapeHtml(movie.title)}</div>
          <div class="search-result-year">${year} &bull; TMDB #${movie.id} [${(movie.original_language || '').toUpperCase()}]</div>
        </div>
      `;

      item.addEventListener("click", () => selectMovie(movie));
      els.searchResults.appendChild(item);
    });
  }

  // Select Movie
  async function selectMovie(movie) {
    closeSearchResults();
    els.movieSearchInput.value = movie.title;

    const year = movie.release_date ? movie.release_date.slice(0, 4) : "—";
    const posterSrc = movie.poster_path ? `${CONFIG.TMDB_IMG_POSTER}${movie.poster_path}` : "";
    const fanartSrc = movie.backdrop_path ? `${CONFIG.TMDB_IMG_BACKDROP}${movie.backdrop_path}` : posterSrc;
    const thumbSrc = movie.backdrop_path ? `${CONFIG.TMDB_IMG_THUMB}${movie.backdrop_path}` : posterSrc;

    state.selectedMovie = {
      id: movie.id,
      title: movie.title,
      original_title: movie.original_title || movie.title,
      year: year,
      release_date: movie.release_date || "",
      language: (movie.original_language || "").toLowerCase(),
      poster: posterSrc,
      fanart: fanartSrc,
      thumbnail: thumbSrc
    };

    els.movieSummary.classList.add("visible");
    els.movieSummaryBackdrop.style.backgroundImage = `url('${fanartSrc}')`;
    els.movieSummaryPoster.src = posterSrc;
    els.movieSummaryTitle.textContent = movie.title;
    els.movieSummaryYear.textContent = year;
    els.movieSummaryId.textContent = "TMDB #" + movie.id;
    els.movieSummaryLang.textContent = state.selectedMovie.language.toUpperCase() || "—";
    els.movieSummarySongCount.textContent = "…";

    els.songsSection.classList.remove("hidden");
    els.saveAllBar.classList.add("hidden");
    state.songs = [];
    renderSongsState("loading");
    updateJsonPreview();

    await loadSoundtrack(state.selectedMovie);
  }

  // Regional & Indian Cinema Soundtrack Matching Engine
  async function loadSoundtrack(movie) {
    try {
      const movieYear = movie.year && movie.year !== "—" ? parseInt(movie.year, 10) : null;
      const lang = movie.language || "";
      const isIndianLang = ["ta", "te", "hi", "kn", "ml"].includes(lang);
      let songs = [];

      // 1. Regional Indian Movies (Tamil, Telugu, Hindi) on JioSaavn
      if (isIndianLang) {
        songs = await fetchExactSaavnAlbum(movie.title, movieYear, lang);
      }

      // 2. iTunes Store Fallback (India Storefront prioritised)
      if (!songs.length) {
        const itunesAlbum = await findExactITunesAlbum(movie.title, movieYear, isIndianLang ? "IN" : "US");
        if (itunesAlbum && itunesAlbum.collectionId) {
          songs = await fetchITunesTracks(itunesAlbum.collectionId, isIndianLang ? "IN" : "US");
        }
      }

      // 3. Original Regional Title check
      if (!songs.length && movie.original_title && movie.original_title !== movie.title) {
        songs = await fetchExactSaavnAlbum(movie.original_title, movieYear, lang);
      }

      if (!songs.length) {
        state.songs = [];
        renderSongsState("not-found");
        els.movieSummarySongCount.textContent = "0";
        updateJsonPreview();
        return;
      }

      state.songs = songs.map((t) => ({
        title: t.title,
        artist: t.artist || "Original Soundtrack",
        drive_url: "",
        thumbnail: movie.thumbnail,
        saved: false,
      }));

      els.movieSummarySongCount.textContent = String(state.songs.length);
      renderSongList();
      updateJsonPreview();
    } catch (err) {
      console.error(err);
      renderSongsState("api-error");
      toast("Error loading the soundtrack.", "error");
    }
  }

  async function fetchExactSaavnAlbum(title, movieYear, lang) {
    try {
      const query = encodeURIComponent(title);
      const res = await fetch(`https://saavn.dev/api/search/albums?query=${query}&limit=10`);
      if (!res.ok) return [];
      const json = await res.json();
      const albums = json?.data?.results || [];
      const cleanTitle = normalize(title);

      for (const alb of albums) {
        const cleanAlb = normalize(alb.name || "");
        const albYear = alb.year ? parseInt(alb.year, 10) : null;
        const albLang = (alb.language || "").toLowerCase();

        const titleMatches = cleanAlb === cleanTitle || cleanAlb.includes(cleanTitle);
        const yearOk = (!movieYear || !albYear) ? true : Math.abs(albYear - movieYear) <= 1;
        const langOk = lang ? albLang.includes(lang) || albLang === "tamil" || albLang === "telugu" || albLang === "hindi" : true;

        if (titleMatches && yearOk && langOk && alb.id) {
          const detailRes = await fetch(`https://saavn.dev/api/albums?id=${alb.id}`);
          if (detailRes.ok) {
            const d = await detailRes.json();
            const trackList = d?.data?.songs || [];
            if (trackList.length) {
              return trackList.map((s) => ({
                title: s.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'"),
                artist: s.artists?.primary?.map((a) => a.name).join(", ") || "Original Soundtrack"
              }));
            }
          }
        }
      }
    } catch (_) {}
    return [];
  }

  async function findExactITunesAlbum(title, movieYear, countryCode = "IN") {
    try {
      const term = encodeURIComponent(`${title} Original Motion Picture Soundtrack`);
      const res = await fetch(`https://itunes.apple.com/search?term=${term}&entity=album&country=${countryCode}&limit=15`);
      if (!res.ok) return null;
      const data = await res.json();
      const cleanTitle = normalize(title);

      for (const alb of (data.results || [])) {
        const cleanAlb = normalize(alb.collectionName || "");
        const albYear = alb.releaseDate ? parseInt(alb.releaseDate.slice(0, 4), 10) : null;
        const artist = (alb.artistName || "").toLowerCase();

        if (cleanTitle === "leo" && (artist.includes("sandler") || cleanAlb.includes("lizard"))) {
          continue;
        }

        const matches = cleanAlb.includes(cleanTitle);
        const yearOk = (!movieYear || !albYear) ? true : Math.abs(albYear - movieYear) <= 1;

        if (matches && yearOk) return alb;
      }
    } catch (_) {}
    return null;
  }

  async function fetchITunesTracks(collectionId, countryCode = "IN") {
    try {
      const res = await fetch(`https://itunes.apple.com/lookup?id=${collectionId}&entity=song&country=${countryCode}`);
      if (!res.ok) return [];
      const data = await res.json();
      return (data.results || [])
        .filter((item) => item.wrapperType === "track")
        .map((t) => ({
          title: t.trackName,
          artist: t.artistName || "Original Artist"
        }));
    } catch (_) {
      return [];
    }
  }

  function normalize(str) {
    return (str || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]/g, "");
  }

  // Song Rendering UI
  function renderSongsState(mode) {
    els.songList.innerHTML = "";
    els.saveAllBar.classList.add("hidden");

    const messages = {
      "no-movie": ["🎬", "Search for a movie to get started."],
      loading: ["", "Searching verified soundtrack album…"],
      "not-found": ["⚠️", "Exact soundtrack not found."],
      "api-error": ["⚠️", "Something went wrong fetching soundtrack."],
    };

    const [icon, text] = messages[mode] || messages["no-movie"];
    const block = document.createElement("div");
    block.className = "state-block" + (mode === "api-error" ? " error" : "");

    if (mode === "loading") {
      block.innerHTML = '<span class="spinner"></span>' + text;
    } else {
      block.innerHTML = `<div class="state-icon">${icon}</div><div>${text}</div>`;
      if (mode === "not-found") {
        block.innerHTML += `<button type="button" class="btn btn-ghost" style="margin-top:12px;" onclick="window.__addManualTrack()">+ Add Track Manually</button>`;
      }
    }

    els.songsStateBlock.innerHTML = "";
    els.songsStateBlock.appendChild(block);
    els.songsStateBlock.classList.remove("hidden");
  }

  window.__addManualTrack = function () {
    const title = prompt("Enter song name:");
    if (title && title.trim()) {
      state.songs.push({
        title: title.trim(),
        artist: state.selectedMovie ? state.selectedMovie.title + " OST" : "Original Track",
        drive_url: "",
        thumbnail: state.selectedMovie ? state.selectedMovie.thumbnail : "",
        saved: false
      });
      els.movieSummarySongCount.textContent = String(state.songs.length);
      renderSongList();
      updateJsonPreview();
    }
  };

  function renderSongList() {
    els.songsStateBlock.classList.add("hidden");
    els.songList.innerHTML = "";

    if (!state.songs.length) {
      renderSongsState("not-found");
      return;
    }

    state.songs.forEach((song, index) => {
      els.songList.appendChild(buildSongCard(song, index));
    });

    els.saveAllBar.classList.remove("hidden");
  }

  function buildSongCard(song, index) {
    const card = document.createElement("div");
    card.className = "card song-card";
    card.dataset.index = String(index);

    card.innerHTML = `
      <div class="song-index">${String(index + 1).padStart(2, "0")}</div>
      <img src="${song.thumbnail}" class="song-thumb-preview" alt="" loading="lazy" />
      <div class="song-body">
        <div class="song-title-row">
          <div class="song-title">${escapeHtml(song.title)}</div>
          <div class="song-artist">${escapeHtml(song.artist || "Original Artist")}</div>
        </div>
        <div class="song-link-row">
          <input
            type="url"
            class="text-input song-link-input"
            placeholder="Paste Google Drive link"
            autocomplete="off"
            value="${escapeHtml(song.drive_url || "")}"
          />
          <button type="button" class="btn btn-gold btn-save">Save</button>
        </div>
        <div class="song-footer">
          <div class="song-status ${song.saved ? 'saved' : 'unsaved'}">
            <span class="status-text">${song.saved ? '✓ Saved' : 'Not saved'}</span>
          </div>
        </div>
      </div>
    `;

    const input = card.querySelector(".song-link-input");
    const statusEl = card.querySelector(".song-status");
    const statusText = card.querySelector(".status-text");
    const saveBtn = card.querySelector(".btn-save");

    function setStatus(kind, label) {
      statusEl.className = "song-status " + kind;
      statusText.textContent = label;
    }

    input.addEventListener("input", () => {
      song.drive_url = input.value.trim();
      song.saved = false;
      setStatus("unsaved", "Not saved");
      updateJsonPreview();
    });

    saveBtn.addEventListener("click", () => {
      const val = input.value.trim();
      if (!val) {
        setStatus("error", "Enter a link first");
        return;
      }
      if (!isValidDriveUrl(val)) {
        setStatus("error", "Not a valid Drive link");
        toast("Please enter a valid Google Drive link.", "error");
        return;
      }

      song.drive_url = val;
      song.saved = true;
      setStatus("saved", "✓ Saved");
      updateJsonPreview();
      toast(`Saved link for "${song.title}".`, "success");
    });

    return card;
  }

  function isValidDriveUrl(url) {
    return /(drive\.google\.com\/(file\/d\/|open\?id=)|^[a-zA-Z0-9_-]{25,}$)/i.test(url.trim());
  }

  // JSON Preview
  if (els.jsonToggle) {
    els.jsonToggle.addEventListener("click", () => {
      els.jsonPanel.classList.toggle("open");
    });
  }

  // Full Payload: Filter Empty Links & Inject Stream URLs
  function buildPayload() {
    if (!state.selectedMovie) return null;
    
    // Only keep songs where drive_url is NOT empty
    const validSongs = state.songs
      .filter((s) => s.drive_url && s.drive_url.trim() !== "")
      .map((s) => ({
        title: s.title,
        artist: s.artist,
        drive_url: s.drive_url.trim(),
        stream_url: generateStreamUrl(s.drive_url.trim()),
        thumbnail: s.thumbnail || state.selectedMovie.thumbnail
      }));

    return {
      movie: state.selectedMovie.title,
      tmdb_id: state.selectedMovie.id,
      year: state.selectedMovie.year,
      poster: state.selectedMovie.poster,
      fanart: state.selectedMovie.fanart,
      songs: validSongs
    };
  }

  function updateJsonPreview() {
    const payload = buildPayload();
    els.jsonOutput.textContent = payload
      ? JSON.stringify(payload, null, 2)
      : "// Select a movie to preview its song data";
  }

  // Commit to chunks/data_c03.json
  els.saveAllBtn.addEventListener("click", saveAllToGithub);

  async function saveAllToGithub() {
    if (!state.selectedMovie || !state.songs.length || state.isCommitting) return;

    const token = localStorage.getItem(CONFIG.TOKEN_KEY);
    if (!token) {
      toast("Click '🔑 Token' button on the top right to configure your GitHub token.", "error");
      return;
    }

    const currentEntry = buildPayload();
    if (!currentEntry.songs.length) {
      toast("Please attach at least one Google Drive link before saving.", "error");
      return;
    }

    state.isCommitting = true;
    els.saveAllBtn.disabled = true;
    els.saveAllBtn.textContent = "Committing to chunks/data_c03.json…";
    setCommitStatus("pending", "Syncing with GitHub...");

    try {
      const endpoint = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPOSITORY}/contents/${CONFIG.GITHUB_TARGET_FILE}`;
      
      let existingData = [];
      let fileSha = null;

      const getRes = await fetch(endpoint, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/vnd.github.v3+json",
        },
      });

      if (getRes.ok) {
        const fileMeta = await getRes.json();
        fileSha = fileMeta.sha;
        try {
          existingData = JSON.parse(decodeURIComponent(escape(atob(fileMeta.content))));
        } catch (_) {
          existingData = [];
        }
      }

      if (!Array.isArray(existingData)) existingData = [];

      const targetIdx = existingData.findIndex(
        (item) => item.tmdb_id === currentEntry.tmdb_id || item.movie === currentEntry.movie
      );

      if (targetIdx >= 0) {
        existingData[targetIdx] = currentEntry;
      } else {
        existingData.unshift(currentEntry);
      }

      const utf8Bytes = unescape(encodeURIComponent(JSON.stringify(existingData, null, 2)));
      const base64Content = btoa(utf8Bytes);

      const putBody = {
        message: `MoinuFlix: Ingest songs, streamer links & fanart for ${state.selectedMovie.title}`,
        content: base64Content,
        branch: CONFIG.GITHUB_BRANCH,
      };
      if (fileSha) putBody.sha = fileSha;

      const putRes = await fetch(endpoint, {
        method: "PUT",
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/vnd.github.v3+json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify(putBody),
      });

      if (!putRes.ok) {
        const errJson = await putRes.json();
        throw new Error(errJson.message || "GitHub commit rejected");
      }

      state.songs.forEach((s) => {
        if (s.drive_url) s.saved = true;
      });
      renderSongList();
      updateJsonPreview();

      setCommitStatus("success", "✓ Successfully committed to chunks/data_c03.json");
      toast("Soundtrack & Streamer links committed to GitHub!", "success");
    } catch (err) {
      console.error(err);
      setCommitStatus("error", err.message || "Commit failed.");
      toast("Commit failed: " + err.message, "error");
    } finally {
      state.isCommitting = false;
      els.saveAllBtn.disabled = false;
      els.saveAllBtn.textContent = "Save All to chunks/data_c03.json";
    }
  }

  function setCommitStatus(kind, text) {
    els.commitStatus.className = "commit-status " + kind;
    els.commitStatus.textContent = text;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  renderSongsState("no-movie");
  updateJsonPreview();
})();
</script>
</body>
</html>
