<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoinuFlix — 5.1 Surround &amp; Soundtrack Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-matte: #0b0d10;
      --bg-surface: #12151a;
      --bg-card: #181c24;
      --bg-card-hover: #1f242e;
      --bg-input: #0e1116;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(212, 175, 55, 0.5);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-gold: #d4af37;
      --accent-gold-soft: rgba(212, 175, 55, 0.15);
      --status-success: #10b981;
      --status-success-soft: rgba(16, 185, 129, 0.15);
      --status-error: #f59e0b;
      --status-error-soft: rgba(245, 158, 11, 0.15);

      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;

      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.6);
      --transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-matte);
      color: var(--text-primary);
      font-family: var(--font-family);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .app-header {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(11, 13, 16, 0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-badge {
      background: var(--accent-gold-soft);
      color: var(--accent-gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-token {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-token:hover {
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    /* Search Section */
    .search-section {
      margin-bottom: 2.5rem;
    }

    .search-wrap {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
    }

    .search-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      letter-spacing: 0.3px;
    }

    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      width: 1.15rem;
      height: 1.15rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input-box input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem 3rem 1rem 2.85rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .search-input-box input:focus {
      border-color: var(--border-focus);
      background-color: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
    }

    .clear-btn {
      position: absolute;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.25rem;
      display: none;
    }

    .clear-btn:hover { color: var(--text-primary); }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-height: 380px;
      overflow-y: auto;
      z-index: 100;
    }

    .autocomplete-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: var(--transition);
    }

    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--bg-card-hover); }

    .item-thumb {
      width: 38px;
      height: 56px;
      background: #000;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .item-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Cinematic Hero */
    .movie-hero {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      min-height: 380px;
      display: flex;
      align-items: flex-end;
      padding: 2.5rem;
      margin-bottom: 3rem;
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      filter: brightness(0.35) saturate(1.1);
      transform: scale(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 13, 16, 0.2) 0%, rgba(11, 13, 16, 0.95) 90%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 2rem;
      align-items: flex-end;
      max-width: 100%;
    }

    .hero-poster-wrap {
      width: 150px;
      height: 225px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      flex-shrink: 0;
      background-color: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-details {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .hero-meta-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
    }

    .pill-year {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .pill-rating {
      background: var(--accent-gold-soft);
      color: var(--accent-gold);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .pill-id {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .hero-overview {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 780px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Songs Section */
    .songs-section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .songs-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .song-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      transition: var(--transition);
    }

    .song-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background-color: var(--bg-card);
    }

    .song-index {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      min-width: 28px;
    }

    .song-title-wrap {
      width: 250px;
      flex-shrink: 0;
    }

    .song-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-input-wrap {
      flex: 1;
    }

    .song-input-wrap input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition);
    }

    .song-input-wrap input:focus {
      border-color: var(--border-focus);
    }

    .song-input-wrap input.invalid {
      border-color: var(--status-error);
      background-color: var(--status-error-soft);
    }

    .song-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .song-status-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
    }

    .song-status-pill.saved {
      background: var(--status-success-soft);
      color: var(--status-success);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.1rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: var(--transition);
    }

    .btn-save-song {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .btn-save-song:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background-color: var(--bg-card-hover);
    }

    .btn-save-all {
      background-color: var(--accent-gold);
      color: #0b0d10;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    .btn-save-all:hover:not(:disabled) {
      background-color: #dfbe4a;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: #0b0d10;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* States & Skeletons */
    .state-card {
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 5rem 2rem;
      text-align: center;
      max-width: 600px;
      margin: 3rem auto;
    }

    .state-icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.8; }
    .state-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    .state-desc { font-size: 0.9rem; color: var(--text-muted); }

    .skeleton {
      background: linear-gradient(90deg, #12151a 25%, #181c24 50%, #12151a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-hero {
      display: flex; gap: 2rem; padding: 2.5rem; background: var(--bg-surface);
      border-radius: var(--radius-lg); margin-bottom: 2rem;
    }
    .skeleton-poster { width: 150px; height: 225px; flex-shrink: 0; }
    .skeleton-meta { flex: 1; display: flex; flex-direction: column; gap: 1rem; justify-content: center; }
    .skeleton-title { height: 36px; width: 45%; }
    .skeleton-tags { height: 20px; width: 25%; }
    .skeleton-text { height: 16px; width: 85%; }
    .skeleton-text.short { width: 50%; }
    .skeleton-card { height: 70px; width: 100%; margin-bottom: 1rem; }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      font-size: 0.88rem;
      color: var(--text-primary);
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
      z-index: 200;
    }

    .toast.visible { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--status-success); }
    .toast.error { border-color: var(--status-error); }

    @media (max-width: 960px) {
      .movie-hero { padding: 1.5rem; }
      .hero-content { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
      .hero-poster-wrap { width: 120px; height: 180px; }
      .hero-title { font-size: 1.85rem; }
      .song-card { flex-direction: column; align-items: stretch; gap: 0.75rem; }
      .song-title-wrap { width: 100%; }
      .song-actions { justify-content: flex-end; }
    }

    @media (max-width: 640px) {
      .songs-section-header { flex-direction: column; align-items: stretch; }
      .btn-save-all { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-badge">5.1 ATMOS</span>
        <span class="brand-title">MoinuFlix Songs</span>
      </div>
      <div class="header-actions">
        <button type="button" id="set-token-btn" class="btn-token">🔑 Config GitHub Token</button>
      </div>
    </div>
  </header>

  <main class="main-container">

    <!-- Movie Search -->
    <section class="search-section">
      <div class="search-wrap">
        <label for="movie-search-input" class="search-label">Search Movie or Soundtrack Album</label>
        <div class="search-input-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="movie-search-input" 
            placeholder="Type movie name (e.g. Leo, Jailer, Vikram, Master)..." 
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear Search">&times;</button>
        </div>

        <div id="autocomplete-dropdown" class="autocomplete-dropdown" hidden>
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>
      </div>
    </section>

    <!-- Empty State -->
    <section id="empty-state" class="state-card empty-state">
      <div class="state-icon">🎧</div>
      <h2 class="state-title">No Movie Selected</h2>
      <p class="state-desc">Type a movie name above. The system will load the poster and auto-fetch all tracks for Google Drive link ingestion.</p>
    </section>

    <!-- Skeleton Loader -->
    <section id="loading-skeleton" class="skeleton-wrap" hidden>
      <div class="skeleton-hero">
        <div class="skeleton skeleton-poster"></div>
        <div class="skeleton-meta">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton skeleton-tags"></div>
          <div class="skeleton skeleton-text"></div>
          <div class="skeleton skeleton-text short"></div>
        </div>
      </div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </section>

    <!-- Active Workspace -->
    <div id="active-workspace" hidden>

      <!-- Movie Backdrop & Hero -->
      <section id="movie-hero" class="movie-hero">
        <div id="hero-backdrop" class="hero-backdrop"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
          <div class="hero-poster-wrap">
            <img id="hero-poster" class="hero-poster" src="" alt="Movie Poster">
          </div>
          <div class="hero-details">
            <div class="hero-meta-row">
              <span id="hero-year" class="pill pill-year"></span>
              <span id="hero-rating" class="pill pill-rating"></span>
              <span id="hero-id" class="pill pill-id"></span>
            </div>
            <h1 id="hero-title" class="hero-title"></h1>
            <p id="hero-overview" class="hero-overview"></p>
          </div>
        </div>
      </section>

      <!-- Songs Listing & Drive Ingest -->
      <section class="songs-section">
        <div class="songs-section-header">
          <div>
            <h2 class="section-title">Tracks &amp; 5.1 Surround Links</h2>
            <p class="section-subtitle" id="song-count-label">Auto-detected tracks</p>
          </div>
          <button type="button" id="save-all-btn" class="btn btn-save-all">
            <span class="btn-spinner" hidden></span>
            <span class="btn-text">Save All to chunks/data_c03.json</span>
          </button>
        </div>

        <div id="songs-list" class="songs-list"></div>
      </section>

    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script>
    // Configuration targeted to your repository and chunks folder
    const CONFIG = {
      TMDB_API_KEY: '051ccf72e026820cb53b8b8531b6a2ba',
      TMDB_BASE: 'https://api.themoviedb.org/3',
      TMDB_IMG_BASE: 'https://image.tmdb.org/t/p',
      
      // Target file inside the Chunks folder
      DB_CHUNK_PATH: 'chunks/data_c03.json',
      GITHUB_OWNER: 'Moinuflix',
      GITHUB_REPOSITORY: 'My-Movies',
      GITHUB_BRANCH: 'main',
      TOKEN_STORAGE_KEY: 'moinuflix_gh_token'
    };

    const state = {
      activeMovie: null,
      songs: [],
      searchDebounceTimer: null,
      isCommitting: false
    };

    const DOM = {
      searchInput: document.getElementById('movie-search-input'),
      clearSearchBtn: document.getElementById('clear-search-btn'),
      autocompleteDropdown: document.getElementById('autocomplete-dropdown'),
      autocompleteList: document.getElementById('autocomplete-list'),
      emptyState: document.getElementById('empty-state'),
      loadingSkeleton: document.getElementById('loading-skeleton'),
      activeWorkspace: document.getElementById('active-workspace'),
      heroBackdrop: document.getElementById('hero-backdrop'),
      heroPoster: document.getElementById('hero-poster'),
      heroTitle: document.getElementById('hero-title'),
      heroYear: document.getElementById('hero-year'),
      heroRating: document.getElementById('hero-rating'),
      heroId: document.getElementById('hero-id'),
      heroOverview: document.getElementById('hero-overview'),
      songCountLabel: document.getElementById('song-count-label'),
      songsList: document.getElementById('songs-list'),
      saveAllBtn: document.getElementById('save-all-btn'),
      setTokenBtn: document.getElementById('set-token-btn'),
      toast: document.getElementById('toast')
    };

    // GitHub Token Setup
    DOM.setTokenBtn.addEventListener('click', () => {
      const existing = localStorage.getItem(CONFIG.TOKEN_STORAGE_KEY) || '';
      const token = prompt('Enter your GitHub Personal Access Token (ghp_...):', existing);
      if (token !== null) {
        localStorage.setItem(CONFIG.TOKEN_STORAGE_KEY, token.trim());
        showToast(token ? 'GitHub Token Saved!' : 'Token cleared', 'success');
      }
    });

    // Autocomplete & Search Handlers
    DOM.searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      DOM.clearSearchBtn.style.display = query ? 'block' : 'none';

      clearTimeout(state.searchDebounceTimer);
      if (!query || query.length < 2) {
        DOM.autocompleteDropdown.hidden = true;
        return;
      }

      state.searchDebounceTimer = setTimeout(() => {
        searchTMDB(query);
      }, 300);
    });

    DOM.clearSearchBtn.addEventListener('click', () => {
      DOM.searchInput.value = '';
      DOM.clearSearchBtn.style.display = 'none';
      DOM.autocompleteDropdown.hidden = true;
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) {
        DOM.autocompleteDropdown.hidden = true;
      }
    });

    async function searchTMDB(query) {
      try {
        const url = `${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=1`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        renderDropdown(data.results || []);
      } catch (_) {}
    }

    function renderDropdown(results) {
      DOM.autocompleteList.innerHTML = '';
      if (!results.length) {
        DOM.autocompleteDropdown.hidden = true;
        return;
      }

      results.slice(0, 6).forEach((movie) => {
        const row = document.createElement('div');
        row.className = 'autocomplete-item';
        const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
        const thumb = movie.poster_path ? `${CONFIG.TMDB_IMG_BASE}/w92${movie.poster_path}` : '';

        row.innerHTML = `
          <img src="${thumb}" class="item-thumb" alt="">
          <div class="item-info">
            <span class="item-title">${escapeHtml(movie.title)}</span>
            <span class="item-meta">${year} &bull; TMDB #${movie.id}</span>
          </div>
        `;

        row.addEventListener('click', () => {
          DOM.autocompleteDropdown.hidden = true;
          selectMovie(movie.id);
        });

        DOM.autocompleteList.appendChild(row);
      });

      DOM.autocompleteDropdown.hidden = false;
    }

    // Select Movie & Fetch Music
    async function selectMovie(tmdbId) {
      showLoading(true);
      try {
        const url = `${CONFIG.TMDB_BASE}/movie/${tmdbId}?api_key=${CONFIG.TMDB_API_KEY}`;
        const res = await fetch(url);
        const movie = await res.json();
        state.activeMovie = movie;

        displayMovieHero(movie);
        await autoFetchTrackList(movie.title);

        DOM.emptyState.hidden = true;
        DOM.activeWorkspace.hidden = false;
      } catch (err) {
        showToast('Error loading movie: ' + err.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    function displayMovieHero(m) {
      DOM.heroTitle.textContent = m.title;
      DOM.heroYear.textContent = m.release_date ? m.release_date.split('-')[0] : 'N/A';
      DOM.heroRating.textContent = `★ ${m.vote_average ? m.vote_average.toFixed(1) : 'NR'}`;
      DOM.heroId.textContent = `TMDB: ${m.id}`;
      DOM.heroOverview.textContent = m.overview || 'No description available.';

      if (m.backdrop_path) {
        DOM.heroBackdrop.style.backgroundImage = `url(${CONFIG.TMDB_IMG_BASE}/w1280${m.backdrop_path})`;
      }
      if (m.poster_path) {
        DOM.heroPoster.src = `${CONFIG.TMDB_IMG_BASE}/w500${m.poster_path}`;
      }
    }

    // Dual Music API Ingestion
    async function autoFetchTrackList(movieTitle) {
      state.songs = [];

      // 1. Try JioSaavn Music API
      try {
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(movieTitle)}&limit=10`);
        if (res.ok) {
          const json = await res.json();
          if (json?.data?.results?.length) {
            state.songs = json.data.results.map(t => ({
              title: t.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'"),
              artist: t.artists?.primary?.map(a => a.name).join(', ') || 'Original Track',
              drive_url: ''
            }));
          }
        }
      } catch (_) {}

      // 2. Try iTunes Music API as fallback
      if (!state.songs.length) {
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(movieTitle)}&entity=song&limit=8`);
          if (res.ok) {
            const data = await res.json();
            if (data?.results?.length) {
              state.songs = data.results.map(i => ({
                title: i.trackName,
                artist: i.artistName || 'Original Soundtrack',
                drive_url: ''
              }));
            }
          }
        } catch (_) {}
      }

      // Default placeholder if API tracks are empty
      if (!state.songs.length) {
        state.songs = [
          { title: `${movieTitle} - Theme / OST`, artist: 'Official Score', drive_url: '' },
          { title: `${movieTitle} - Track 01`, artist: 'Soundtrack', drive_url: '' }
        ];
      }

      renderSongCards();
    }

    function renderSongCards() {
      DOM.songsList.innerHTML = '';
      DOM.songCountLabel.textContent = `${state.songs.length} Tracks automatically found`;

      state.songs.forEach((song, idx) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        const num = String(idx + 1).padStart(2, '0');

        card.innerHTML = `
          <div class="song-index">${num}</div>
          <div class="song-title-wrap">
            <div class="song-title" title="${escapeHtml(song.title)}">${escapeHtml(song.title)}</div>
            <div class="song-artist">${escapeHtml(song.artist)}</div>
          </div>
          <div class="song-input-wrap">
            <input 
              type="url" 
              id="drive-input-${idx}" 
              placeholder="Paste Google Drive link for this song..." 
              value="${escapeHtml(song.drive_url)}"
            >
          </div>
          <div class="song-actions">
            <span id="status-pill-${idx}" class="song-status-pill ${song.drive_url ? 'saved' : ''}">
              ${song.drive_url ? '✓ Attached' : 'Unsaved'}
            </span>
            <button type="button" class="btn btn-save-song" onclick="saveIndividualSong(${idx})">Save</button>
          </div>
        `;

        DOM.songsList.appendChild(card);
      });
    }

    window.saveIndividualSong = function(index) {
      const input = document.getElementById(`drive-input-${index}`);
      const pill = document.getElementById(`status-pill-${index}`);
      const val = input.value.trim();

      if (!val) {
        input.classList.add('invalid');
        showToast('Please paste a valid Google Drive link', 'error');
        return;
      }

      input.classList.remove('invalid');
      state.songs[index].drive_url = val;

      pill.className = 'song-status-pill saved';
      pill.textContent = '✓ Attached';
      showToast(`Link attached for: ${state.songs[index].title}`, 'success');
    };

    // Save All to chunks/data_c03.json
    DOM.saveAllBtn.addEventListener('click', async () => {
      if (state.isCommitting) return;

      const token = localStorage.getItem(CONFIG.TOKEN_STORAGE_KEY);
      if (!token) {
        showToast('Click "🔑 Config GitHub Token" at top right to enter your token first.', 'error');
        return;
      }

      const readySongs = state.songs.filter(s => s.drive_url && s.drive_url.trim());
      if (!readySongs.length) {
        showToast('Please attach at least one Google Drive song link.', 'error');
        return;
      }

      setSavingState(true);

      try {
        showToast('Reading current chunks/data_c03.json...', '');
        
        const endpoint = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPOSITORY}/contents/${CONFIG.DB_CHUNK_PATH}`;
        
        let existingData = [];
        let fileSha = null;

        const getRes = await fetch(endpoint, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (getRes.ok) {
          const fileMeta = await getRes.json();
          fileSha = fileMeta.sha;
          try {
            existingData = JSON.parse(decodeURIComponent(escape(atob(fileMeta.content))));
          } catch (_) {
            existingData = [];
          }
        }

        if (!Array.isArray(existingData)) existingData = [];

        // Build Payload
        const currentPayload = {
          movie: state.activeMovie.title,
          tmdb_id: state.activeMovie.id,
          year: state.activeMovie.release_date ? state.activeMovie.release_date.split('-')[0] : '',
          poster: state.activeMovie.poster_path ? `${CONFIG.TMDB_IMG_BASE}/w500${state.activeMovie.poster_path}` : '',
          songs: readySongs.map(s => ({
            title: s.title,
            artist: s.artist,
            drive_url: s.drive_url.trim()
          }))
        };

        const targetIndex = existingData.findIndex(item => item.tmdb_id === currentPayload.tmdb_id || item.movie === currentPayload.movie);
        if (targetIndex >= 0) {
          existingData[targetIndex] = currentPayload;
        } else {
          existingData.unshift(currentPayload);
        }

        showToast('Committing to chunks/data_c03.json...', '');

        const utf8Bytes = unescape(encodeURIComponent(JSON.stringify(existingData, null, 2)));
        const base64Content = btoa(utf8Bytes);

        const putBody = {
          message: `MoinuFlix: Ingest songs for ${state.activeMovie.title}`,
          content: base64Content,
          branch: CONFIG.GITHUB_BRANCH
        };
        if (fileSha) putBody.sha = fileSha;

        const putRes = await fetch(endpoint, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(putBody)
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || 'GitHub rejected the update');
        }

        showToast('✓ Successfully saved all songs to chunks/data_c03.json!', 'success');
      } catch (err) {
        showToast('Save Failed: ' + err.message, 'error');
      } finally {
        setSavingState(false);
      }
    });

    function showLoading(active) {
      DOM.loadingSkeleton.hidden = !active;
      if (active) {
        DOM.emptyState.hidden = true;
        DOM.activeWorkspace.hidden = true;
      }
    }

    function setSavingState(isBusy) {
      state.isCommitting = isBusy;
      DOM.saveAllBtn.disabled = isBusy;
      DOM.saveAllBtn.querySelector('.btn-spinner').hidden = !isBusy;
      DOM.saveAllBtn.querySelector('.btn-text').textContent = isBusy ? 'Committing...' : 'Save All to chunks/data_c03.json';
    }

    function showToast(msg, type = '') {
      DOM.toast.textContent = msg;
      DOM.toast.className = `toast visible ${type}`.trim();
      clearTimeout(DOM.toast._timer);
      DOM.toast._timer = setTimeout(() => {
        DOM.toast.className = 'toast';
      }, 4000);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
