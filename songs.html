<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Songs Studio (Folder Batch) · MoinuFlix</title>
  <style>
    :root {
      --bg: #040711;
      --bg-elevated: #091224;
      --card: rgba(13, 22, 38, 0.85);
      --card-hover: rgba(22, 36, 61, 0.95);
      --border: rgba(56, 189, 248, 0.18);
      --border-strong: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --laser-cyan: #38bdf8;
      --laser-green: #10b981;
      --neon-gold: #f59e0b;
      --error: #ef4444;
      --radius-lg: 16px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
    .site-header { background: rgba(8, 14, 28, 0.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 900px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand-name { font-size: 1.2rem; font-weight: 800; }
    .brand-name span { color: var(--laser-cyan); }
    .page { max-width: 900px; margin: 0 auto; padding: 25px 20px 80px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
    .input, .text-input { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); color: #fff; border-radius: var(--radius-md); padding: 12px 14px; font-size: 14px; }
    .input:focus, .text-input:focus { outline: none; border-color: var(--laser-cyan); }
    .search-row { position: relative; display: flex; gap: 10px; }
    .search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); max-height: 300px; overflow-y: auto; z-index: 30; display: none; }
    .search-results.open { display: block; }
    .search-result-item { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .search-result-item:hover { background: var(--card-hover); }
    .search-result-poster { width: 38px; height: 56px; border-radius: 6px; object-fit: cover; }
    .movie-summary { display: none; position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); margin-bottom: 20px; }
    .movie-summary.visible { display: block; }
    .movie-summary-backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.22) blur(1px); }
    .movie-summary-content { position: relative; z-index: 3; display: flex; gap: 18px; padding: 18px; }
    .movie-summary-poster { width: 90px; height: 135px; border-radius: 10px; object-fit: cover; }
    .meta-chip { font-size: 12px; color: var(--text-secondary); background: rgba(19, 19, 19, 0.85); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; }
    .meta-chip.gold { color: var(--neon-gold); border-color: var(--neon-gold); }
    .btn { border: 1px solid var(--border-strong); background: var(--bg-elevated); color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn:hover { background: var(--card-hover); }
    .btn-cyan { background: var(--laser-cyan); border-color: var(--laser-cyan); color: #000; }
    .btn-cyan:hover { background: #7dd3fc; }
    .btn-block { width: 100%; padding: 14px; font-size: 15px; border-radius: 12px; }
    .song-list { display: flex; flex-direction: column; gap: 12px; }
    .song-card { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .song-index { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--laser-cyan); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .song-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .hidden { display: none !important; }
    #laser-toast { position: fixed; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.98); border: 1px solid var(--laser-cyan); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; display: none; z-index: 500; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-name">Moinu<span>Flix</span> — Songs Studio</div>
    <div style="display:flex; gap:10px;">
      <a href="chunk_01/m_view.html" class="btn">📊 Dashboard</a>
      <button type="button" class="btn" id="tokenConfigBtn">⚙️ GitHub Token</button>
    </div>
  </div>
</header>

<main class="page">
  <!-- 1. MOVIE SEARCH -->
  <section class="card">
    <h2 style="font-size:14px; color:var(--text-secondary); margin-bottom:10px;">1. Select Movie (Auto Metadata & Posters)</h2>
    <div class="search-row">
      <input type="text" id="movieSearchInput" class="input" placeholder="Type movie name (e.g. Paiyaa, Leo, Thodari, Ghilli)..." autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
  </section>

  <!-- MOVIE PREVIEW -->
  <div class="movie-summary" id="movieSummary">
    <div class="movie-summary-backdrop" id="movieSummaryBackdrop"></div>
    <div class="movie-summary-content">
      <img class="movie-summary-poster" id="movieSummaryPoster" alt="" />
      <div>
        <h2 id="movieSummaryTitle" style="font-size:22px; font-weight:800;"></h2>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <span class="meta-chip" id="movieSummaryYear"></span>
          <span class="meta-chip" id="movieSummaryId"></span>
          <span class="meta-chip gold" id="movieSummaryLang"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. BATCH FOLDER INGEST -->
  <section class="card hidden" id="folderSection">
    <h2 style="font-size:14px; color:var(--laser-cyan); margin-bottom:8px;">2. Ingest 5.1 Songs from Google Drive Folder</h2>
    <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">Paste full folder link containing video songs to auto-extract every track at once</p>
    <div style="display:flex; gap:10px;">
      <input type="text" id="folderUrlInput" class="input" placeholder="Paste Google Drive Folder link or Folder ID" />
      <button type="button" class="btn btn-cyan" onclick="scanSongsFolder()">⚡ Auto Extract All</button>
    </div>
  </section>

  <!-- 3. TRACKLIST EDITOR -->
  <section class="hidden" id="songsSection">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="font-size:15px; font-weight:700;">Extracted 5.1 Video Tracks</h2>
      <button type="button" class="btn" onclick="addManualRow()">+ Add Single Song</button>
    </div>
    <div class="song-list" id="songList"></div>

    <div style="margin-top:25px;">
      <button class="btn btn-cyan btn-block" id="commitAllBtn" onclick="commitSongsToChunk()">🚀 COMMIT ALL SONGS TO chunks/data_c03.json</button>
      <div id="commitStatus" style="font-size:12px; text-align:center; margin-top:8px; color:var(--text-secondary);"></div>
    </div>
  </section>
</main>

<div id="laser-toast"></div>

<script>
const CONFIG = {
  TMDB_API_KEY: "051ccf72e026820cb53b8b8531b6a2ba",
  STREAMER_HOST: "https://gdrive-stream.moinudeentv.workers.dev/?id=",
  STREAM_HEADER: "|User-Agent=Kodi-MoinuTV-PrivatePlayer/1.0",
  GITHUB_OWNER: "Moinuflix",
  GITHUB_REPO: "My-Movies",
  GITHUB_BRANCH: "main",
  TARGET_CHUNK: "chunks/data_c03.json"
};

let selectedMovie = null;
let tracks = [];

function showToast(msg, isError = false) {
  const t = document.getElementById("laser-toast");
  t.textContent = (isError ? "❌ " : "⚡ ") + msg;
  t.style.borderColor = isError ? "var(--error)" : "var(--laser-cyan)";
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3500);
}

function extractDriveId(url) {
  if (!url) return "";
  const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/\/folders\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  return match ? match[1] : url.trim();
}

document.getElementById("tokenConfigBtn").addEventListener("click", () => {
  const c = localStorage.getItem("moinuflix_gh_token") || "";
  const input = prompt("Enter your GitHub Token (ghp_...):", c);
  if (input !== null) {
    localStorage.setItem("moinuflix_gh_token", input.trim());
    showToast("GitHub Token Saved!");
  }
});

let timer = null;
document.getElementById("movieSearchInput").addEventListener("input", (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  const box = document.getElementById("searchResults");
  if(!q) { box.classList.remove("open"); return; }
  timer = setTimeout(async () => {
    try {
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${CONFIG.TMDB_API_KEY}&query=${encodeURIComponent(q)}`);
      const d = await res.json();
      box.innerHTML = "";
      if(d.results && d.results.length) {
        d.results.slice(0, 6).forEach(m => {
          const row = document.createElement("div");
          row.className = "search-result-item";
          row.innerHTML = `
            <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w200' + m.poster_path : ''}" class="search-result-poster">
            <div>
              <div style="font-weight:700; font-size:14px;">${m.title}</div>
              <div style="font-size:12px; color:var(--text-secondary);">${m.release_date ? m.release_date.slice(0,4) : '—'} • TMDB #${m.id}</div>
            </div>`;
          row.onclick = () => selectMovie(m);
          box.appendChild(row);
        });
        box.classList.add("open");
      }
    } catch(err) {}
  }, 300);
});

function selectMovie(m) {
  document.getElementById("searchResults").classList.remove("open");
  document.getElementById("movieSearchInput").value = m.title;
  selectedMovie = {
    id: m.id,
    title: m.title,
    year: m.release_date ? m.release_date.slice(0, 4) : "2024",
    poster: m.poster_path ? "https://image.tmdb.org/t/p/w500" + m.poster_path : "",
    fanart: m.backdrop_path ? "https://image.tmdb.org/t/p/original" + m.backdrop_path : "",
    thumbnail: m.backdrop_path ? "https://image.tmdb.org/t/p/w780" + m.backdrop_path : ""
  };

  document.getElementById("movieSummary").classList.add("visible");
  document.getElementById("movieSummaryBackdrop").style.backgroundImage = `url('${selectedMovie.fanart}')`;
  document.getElementById("movieSummaryPoster").src = selectedMovie.poster;
  document.getElementById("movieSummaryTitle").textContent = selectedMovie.title;
  document.getElementById("movieSummaryYear").textContent = selectedMovie.year;
  document.getElementById("movieSummaryId").textContent = "TMDB #" + selectedMovie.id;
  document.getElementById("movieSummaryLang").textContent = (m.original_language || "ta").toUpperCase();

  document.getElementById("folderSection").classList.remove("hidden");
  document.getElementById("songsSection").classList.remove("hidden");
}

function detectAudioMix(title) {
  const l = title.toLowerCase();
  if (l.includes("atmos")) return "Dolby Atmos";
  if (l.includes("dts-hd")) return "DTS-HD MA 5.1";
  if (l.includes("dts")) return "1509k DTS 5.1";
  if (l.includes("flac")) return "FLAC 5.1 Lossless";
  if (l.includes("ddp") || l.includes("dd+")) return "DD+ 5.1";
  return "5.1 Surround";
}

async function scanSongsFolder() {
  const fUrl = document.getElementById("folderUrlInput").value;
  const fId = extractDriveId(fUrl);
  if(!fId) return showToast("Enter valid Google Drive Folder link!", true);
  
  showToast("Scanning folder contents via Worker...");
  try {
    const res = await fetch(`https://gdrive-stream.moinudeentv.workers.dev/list?id=${fId}`);
    if(res.ok) {
      const data = await res.json();
      if(data.files && data.files.length) {
        tracks = data.files.map((file, idx) => {
          let cleanTitle = file.name.replace(/\.(mkv|mp4|avi)$/i, '').replace(/[\._\-]/g, ' ');
          return {
            id: file.id,
            title: cleanTitle,
            artist: selectedMovie.title + " OST",
            audio: detectAudioMix(file.name),
            drive_id: file.id
          };
        });
        renderTracks();
        showToast(`Extracted ${tracks.length} tracks automatically!`);
        return;
      }
    }
  } catch(e) {}
  
  // Fallback demo row if worker list is not configured
  addManualRow();
  showToast("Folder hook ready. Add drive tracks below.");
}

function addManualRow() {
  tracks.push({
    id: "",
    title: selectedMovie ? selectedMovie.title + " Video Song" : "Track Name",
    artist: "Original 5.1 Soundtrack",
    audio: "5.1 Surround",
    drive_id: ""
  });
  renderTracks();
}

function renderTracks() {
  const box = document.getElementById("songList");
  box.innerHTML = "";
  tracks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "song-card";
    div.innerHTML = `
      <div class="song-index">${String(i+1).padStart(2, '0')}</div>
      <div class="song-body">
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
          <input type="text" class="text-input" value="${t.title}" oninput="tracks[${i}].title=this.value" placeholder="Track Name">
          <input type="text" class="text-input" value="${t.audio}" oninput="tracks[${i}].audio=this.value" placeholder="Audio Mix">
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
          <input type="text" class="text-input" value="${t.drive_id}" oninput="tracks[${i}].drive_id=this.value" placeholder="Song GDrive File ID">
          <button class="btn" style="color:var(--error);" onclick="removeTrack(${i})">✕</button>
        </div>
      </div>
    `;
    box.appendChild(div);
  });
}

function removeTrack(i) {
  tracks.splice(i, 1);
  renderTracks();
}

async function commitSongsToChunk() {
  const token = localStorage.getItem("moinuflix_gh_token");
  if(!token) return showToast("Set GitHub Token first!", true);
  if(!selectedMovie) return showToast("Select movie first!", true);
  if(!tracks.length) return showToast("No tracks to commit!", true);

  showToast("Committing 5.1 Pack to chunks/data_c03.json...");
  const validTracks = tracks.map((t, idx) => ({
    id: t.drive_id,
    title: t.title,
    track_number: idx + 1,
    artist: t.artist,
    plot: `${selectedMovie.title} - ${t.title} Official ${t.audio} Video Song.`,
    thumb: selectedMovie.thumbnail,
    fanart: selectedMovie.fanart,
    stream_url: `${CONFIG.STREAMER_HOST}${t.drive_id}${CONFIG.STREAM_HEADER}`,
    specs: {
      resolution: "1080p FHD",
      codec: "H.264",
      audio: t.audio,
      channels: "5.1"
    }
  }));

  const albumPack = {
    id: `album_${selectedMovie.id}`,
    title: `${selectedMovie.title} (5.1 Surround Soundtracks)`,
    original_title: selectedMovie.title,
    movie: selectedMovie.title,
    tmdb_id: selectedMovie.id,
    year: selectedMovie.year,
    rating: 8.0,
    plot: `${selectedMovie.title} Complete 5.1 Surround Master Video Pack.`,
    poster: selectedMovie.poster,
    fanart: selectedMovie.fanart,
    logo: selectedMovie.thumbnail,
    tracks: validTracks
  };

  try {
    const url = `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.TARGET_CHUNK}`;
    let existing = [];
    let sha = null;
    const gRes = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if(gRes.ok) {
      const meta = await gRes.json();
      sha = meta.sha;
      existing = JSON.parse(decodeURIComponent(escape(atob(meta.content))));
    }
    const idx = existing.findIndex(a => a.tmdb_id === selectedMovie.id || a.movie === selectedMovie.title);
    if(idx >= 0) existing[idx] = albumPack;
    else existing.unshift(albumPack);

    const bin = Array.from(new TextEncoder().encode(JSON.stringify(existing, null, 2))).map(b => String.fromCharCode(b)).join("");
    const pRes = await fetch(url, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `MoinuFlix: Ingest 5.1 Folder Tracks for ${selectedMovie.title}`,
        content: btoa(bin),
        branch: CONFIG.GITHUB_BRANCH,
        sha: sha
      })
    });
    if(!pRes.ok) throw new Error("Commit failed");
    showToast("🎉 Entire 5.1 Album Pack Committed to GitHub!");
    document.getElementById("commitStatus").textContent = "✓ Successfully synced with chunks/data_c03.json";
  } catch(e) {
    showToast("Failed to commit to GitHub", true);
  }
}
</script>
</body>
</html>
