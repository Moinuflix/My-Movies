  <!-- Preserved V1 Data Loading Logic Upgraded with Master UI State & No Fallback Fabrication -->
  <script>
    async function loadView(chunkPath, btnElement) {
      const gw = document.getElementById("grid-wrap");
      const badge = document.getElementById("catalog-count-badge");

      // Update Filter Button Active States
      if (btnElement) {
        document.querySelectorAll(".filter-btn").forEach(el => el.classList.remove("is-active"));
        btnElement.classList.add("is-active");
      }

      // V2 Empty & Loading State Container
      gw.innerHTML = `
        <div class="state-box" style="grid-column: 1 / -1;">
          <span class="state-box__title">Catalog Loading</span>
          <span class="state-box__desc">Fetching records from ${chunkPath}...</span>
        </div>
      `;

      try {
        let list = [];
        if (typeof fetchChunk === "function") {
          list = await fetchChunk(chunkPath);
        } else {
          const res = await fetch(chunkPath);
          if (res.ok) list = await res.json();
        }

        if (!Array.isArray(list)) list = [];

        gw.innerHTML = "";
        badge.textContent = `${list.length} Movies`;

        if (list.length === 0) {
          gw.innerHTML = `
            <div class="state-box" style="grid-column: 1 / -1;">
              <span class="state-box__title">No Movies Found</span>
              <span class="state-box__desc">No records are available in this catalog chunk.</span>
            </div>
          `;
          return;
        }

        list.forEach(m => {
          const card = document.createElement("div");
          card.className = "movie-card";

          // Strict Data Rules: Zero Invented Values
          const title = m.title || "Untitled";
          const year = (m.year !== undefined && m.year !== null && String(m.year).trim() !== "") ? m.year : "—";
          const resolution = (m.specs && m.specs.resolution) ? m.specs.resolution : (m.resolution || "—");
          const size = (m.specs && m.specs.size) ? m.specs.size : (m.size || "—");
          const posterUrl = m.poster || "";

          // Secure Poster Container with Fallback
          let posterHtml = "";
          if (posterUrl) {
            posterHtml = `
              <img src="${posterUrl}" 
                   class="movie-card__poster" 
                   alt="${title}" 
                   loading="lazy" 
                   onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'movie-card__poster-fallback\\'><span>No Poster</span></div>';">
            `;
          } else {
            posterHtml = `<div class="movie-card__poster-fallback"><span>No Poster</span></div>`;
          }

          card.innerHTML = `
            <div class="movie-card__poster-box">
              ${posterHtml}
            </div>
            <div class="movie-card__body">
              <div class="movie-card__title" title="${title} (${year})">${title} (${year})</div>
              <div class="movie-card__meta">
                <span>${resolution}</span>
                <span>•</span>
                <span>${size}</span>
              </div>
            </div>
          `;

          gw.appendChild(card);
        });

      } catch (err) {
        console.error("Failed to load chunk view:", err);
        gw.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1; border-color: var(--status-danger-border);">
            <span class="state-box__title" style="color: var(--status-danger);">Error Loading Catalog</span>
            <span class="state-box__desc">${err.message || 'Unable to fetch chunk data.'}</span>
          </div>
        `;
        badge.textContent = "Error";
        if (typeof MoinuUI !== "undefined" && MoinuUI.toast) {
          MoinuUI.toast(`Failed to load ${chunkPath}`, "danger");
        }
      }
    }

    // Modal Helper for GitHub Token Configuration
    function configureGithubToken() {
      const cur = localStorage.getItem("moinu_gh_token") || "";
      const input = document.getElementById("cfg-gh-token");
      if (input) input.value = cur;
      if (typeof MoinuUI !== "undefined" && MoinuUI.openModal) {
        MoinuUI.openModal("modal-gh-config");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const saveBtn = document.getElementById("btn-save-gh-token");
      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          const val = document.getElementById("cfg-gh-token").value.trim();
          if (val) {
            localStorage.setItem("moinu_gh_token", val);
            if (typeof MoinuUI !== "undefined") {
              MoinuUI.closeModal("modal-gh-config");
              MoinuUI.toast("GitHub Token saved locally.", "success");
            }
          }
        });
      }

      // Initial Default View Ingestion
      loadView("chunks/data_c01.json", document.getElementById("btn-all"));
    });
  </script>
